<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Belly Bears - Game</title>

    <script src="supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background: #000; overflow: hidden; touch-action: none; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 5; }

        #ingame-ui {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 15; pointer-events: none;
        }
        .stat {
            position: absolute; color: white; font-weight: bold; font-size: 24px;
            text-shadow: 0 0 10px rgba(0,0,0,0.9); z-index: 20;
        }
        #scoreDisplay { top: 20px; left: 25px; }
        #levelDisplay { top: 20px; right: 75px; color: #f1c40f; }
        #comboDisplay { top: 65px; left: 25px; font-size: 20px; color: #ffeb3b; display: none; }
        #bellyPassUI {
            top: 110px; left: 25px; font-size: 18px; background: rgba(0,0,0,0.5);
            padding: 6px 14px; border-radius: 9999px;
        }

        /* TOMBOL MAGNET — dinaikkan ke atas */
        #magnetBtn {
            position: absolute;
            bottom: 130px;   /* <-- naik dari 30px */
            right: 25px;
            width: 70px; height: 70px;
            background: rgba(0,0,0,0.75);
            border: 4px solid #f39c12;
            border-radius: 50%;
            color: #f1c40f;
            font-size: 36px;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 40;
            pointer-events: auto;
            box-shadow: 0 0 25px rgba(243,156,18,0.7);
            transition: all 0.2s;
        }
        #magnetBtn:active { transform: scale(0.85); background: #f39c12; color: #000; }

        canvas { cursor: none; touch-action: none; }

        /* SLOW / JAM OVERLAY */
        #slow-overlay {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 12;
            border: 7px solid rgba(180, 0, 255, 0.75);
            box-shadow: inset 0 0 60px rgba(180, 0, 255, 0.35);
            background: rgba(80, 0, 160, 0.08);
            animation: slowPulse 0.7s ease-in-out infinite alternate;
        }
        @keyframes slowPulse {
            from { border-color: rgba(180,0,255,0.4); box-shadow: inset 0 0 40px rgba(180,0,255,0.2); }
            to   { border-color: rgba(255,100,255,1);  box-shadow: inset 0 0 90px rgba(255,0,255,0.35); }
        }

        /* COUNTDOWN */
        #countdown-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75); display: none;
            justify-content: center; align-items: center;
            z-index: 200; flex-direction: column;
        }
        #countdown-number {
            font-size: 160px; color: #f39c12; font-weight: bold;
            text-shadow: 0 0 60px #f39c12, 0 0 20px #fff;
            line-height: 1;
        }

        /* GAME OVER */
        #game-over-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92); z-index: 300;
            flex-direction: column; justify-content: center; align-items: center;
            color: white; text-align: center;
        }
        #game-over-overlay h1 { font-size: 3.2rem; color: #f39c12; margin: 0 0 10px 0; text-shadow: 0 0 30px #f39c12; }
        .final-score { font-size: 5rem; font-weight: bold; color: #f1c40f; margin: 5px 0; text-shadow: 0 0 20px #f1c40f88; }
        .go-btn {
            padding: 14px 32px; font-size: 1.2rem; border: none; border-radius: 12px;
            cursor: pointer; font-weight: 700; transition: transform 0.1s;
        }
        .go-btn:active { transform: scale(0.96); }
    </style>
</head>
<body>

    <!-- LOADING SCREEN -->
    <div id="loading-screen" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#1a1a1a;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:500;">
        <img src="assets/ICON.png" alt="Belly Bears" style="width:130px;height:130px;margin-bottom:25px;">
        <h2 style="color:#f39c12;margin:0 0 20px 0;font-size:1.8rem;">Loading Assets...</h2>
        <div style="width:220px;height:10px;background:#333;border-radius:9999px;overflow:hidden;">
            <div id="loading-bar" style="width:0%;height:100%;background:linear-gradient(to right,#f39c12,#f1c40f);transition:width 0.4s;"></div>
        </div>
        <p id="loading-text" style="color:#aaa;margin-top:12px;font-size:1rem;">Preparing game...</p>
    </div>

    <canvas id="gameCanvas"></canvas>

    <!-- SLOW OVERLAY -->
    <div id="slow-overlay"></div>

    <div id="ingame-ui">
        <div class="stat" id="scoreDisplay">Score: 0</div>
        <div class="stat" id="levelDisplay">Level 1</div>
        <div class="stat" id="comboDisplay">Combo ×1.5</div>
        <div id="bellyPassUI" class="stat"></div>
        <button id="pauseBtn" style="position:absolute;top:20px;right:25px;font-size:32px;color:white;background:none;border:none;cursor:pointer;pointer-events:auto;z-index:30;">⏸</button>
        <button id="magnetBtn">🧲</button>
    </div>

    <!-- COUNTDOWN -->
    <div id="countdown-screen">
        <div id="countdown-number">3</div>
    </div>

    <!-- GAME OVER -->
    <div id="game-over-overlay">
        <h1>GAME OVER</h1>
        <p style="font-size:1.4rem;margin:4px 0 0 0;color:#aaa;">Final Score</p>
        <div class="final-score" id="go-score">0</div>
        <p style="font-size:1.2rem;margin:4px 0 24px 0;color:#ccc;">Coins Caught: <span id="go-coins">0</span></p>
        <div style="display:flex;gap:16px;">
            <button class="go-btn" onclick="restartGame()" style="background:#f39c12;color:#000;">▶ PLAY AGAIN</button>
            <button class="go-btn" onclick="backToMenu()" style="background:#444;color:#fff;">⬅ MENU</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.setHeaderColor("#1a1a1a");

        const sb = supabase.createClient(window.SUPABASE_CONFIG.URL, window.SUPABASE_CONFIG.ANON_KEY);

        // DOM
        const canvas        = document.getElementById("gameCanvas");
        const ctx           = canvas.getContext("2d");
        const ingameUI      = document.getElementById("ingame-ui");
        const countdownScreen  = document.getElementById("countdown-screen");
        const countdownNumber  = document.getElementById("countdown-number");
        const scoreDisplay  = document.getElementById("scoreDisplay");
        const levelDisplay  = document.getElementById("levelDisplay");
        const comboDisplay  = document.getElementById("comboDisplay");
        const bellyPassUI   = document.getElementById("bellyPassUI");
        const pauseBtn      = document.getElementById("pauseBtn");
        const magnetBtn     = document.getElementById("magnetBtn");
        const gameOverOverlay = document.getElementById("game-over-overlay");
        const slowOverlay   = document.getElementById("slow-overlay");

        let isPlaying = false, isPaused = false;
        let score = 0, caughtCoins = 0, level = 1, combo = 0;
        let speed = 3.5, spawnInterval = 850;
        let spawnTimer;
        let items = [], particles = [], leaves = [], floatingTexts = [];
        let slowMotionUntil = 0;
        let animFrameId = null;

        // Belly Pass
        let bellyPass = null;
        let shieldCharges = 0;
        let magnetUntil = 0;
        let doubleCoinsMultiplier = 1;

        // ── AUDIO ──────────────────────────────────────────────────────────────
        const bgMusic              = new Audio('assets/music-game.mp3');   bgMusic.loop = true; bgMusic.volume = 0.75;
        const eatSound             = new Audio('assets/suara-makan.m4a');  eatSound.volume = 0.55;
        const bombSound            = new Audio('assets/bom-bgm.m4a');      bombSound.volume = 0.65;
        const jamMusic             = new Audio('assets/jam-bgm.m4a');      jamMusic.volume = 0.55;
        const magnetActivateSound  = new Audio('assets/magnet-activate.m4a'); magnetActivateSound.volume = 0.65;
        const shieldSound          = new Audio('assets/shield-activate.m4a');  shieldSound.volume = 0.6;

        const ALL_AUDIO = [bgMusic, eatSound, bombSound, jamMusic, magnetActivateSound, shieldSound];

        // ── BEAR ───────────────────────────────────────────────────────────────
        const bear = {
            x: 0, y: 0, width: 90, height: 90,
            imgPending : new Image(),
            imgEating  : new Image(),
            currentImg : null
        };
        bear.imgPending.src = "assets/Beruang-pending.png";
        bear.imgEating.src  = "assets/Beruang-makan.png";
        bear.currentImg     = bear.imgPending;

        const coinImg       = new Image(); coinImg.src       = "assets/coin.png";
        const bombImg       = new Image(); bombImg.src       = "assets/bom.png";
        const backgroundImg = new Image(); backgroundImg.src = "assets/Background-game.png";
        const slowPowerImg  = new Image(); slowPowerImg.src  = "assets/slow-power.png";

        // ── LEAF ───────────────────────────────────────────────────────────────
        class Leaf {
            constructor(){ this.reset(); }
            reset(){
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * -canvas.height * 1.5;
                this.size = Math.random() * 9 + 4;
                this.speed = Math.random() * 1.5 + 0.5;
                this.wobble = Math.random() * Math.PI * 2;
                this.wobbleSpeed = Math.random() * 0.08 + 0.04;
                this.opacity = Math.random() * 0.5 + 0.2;
            }
            update(){
                this.y += this.speed;
                this.wobble += this.wobbleSpeed;
                this.x += Math.sin(this.wobble) * 1.6;
                if (this.y > canvas.height + 20) this.reset();
            }
            draw(){
                ctx.save(); ctx.globalAlpha = this.opacity;
                ctx.translate(this.x, this.y); ctx.rotate(Math.sin(this.wobble) * 0.45);
                ctx.fillStyle = "#4ade80"; ctx.beginPath();
                ctx.ellipse(0, 0, this.size, this.size * 0.58, 0, 0, Math.PI * 2);
                ctx.fill(); ctx.restore();
            }
        }

        // ── PARTICLE ───────────────────────────────────────────────────────────
        class Particle {
            constructor(x, y, options = {}){
                this.x = x;
                this.y = y;
                this.vx = options.vx ?? Math.random() * 6 - 3;
                this.vy = options.vy ?? Math.random() * -5 - 2;
                this.life = options.life ?? 28;
                this.maxLife = this.life;
                this.color = options.color ?? `hsl(${Math.random()*40+40},100%,70%)`;
                this.size = options.size ?? 6;
            }
            update(){ this.x += this.vx; this.y += this.vy; this.vy += 0.25; this.life--; }
            draw(){
                ctx.save();
                ctx.globalAlpha = this.life / this.maxLife;
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.restore();
            }
        }

        // ── FLOATING TEXT ──────────────────────────────────────────────────────
        class FloatingText {
            constructor(x, y, text, color = '#f1c40f'){
                this.x = x; this.y = y;
                this.text = text; this.color = color;
                this.life = 45; this.maxLife = 45;
                this.vy = -2.2;
            }
            update(){ this.y += this.vy; this.vy *= 0.97; this.life--; }
            draw(){
                ctx.save();
                ctx.globalAlpha = this.life / this.maxLife;
                ctx.font = 'bold 22px Arial';
                ctx.lineWidth = 3;
                ctx.strokeStyle = 'rgba(0,0,0,0.8)';
                ctx.strokeText(this.text, this.x, this.y);
                ctx.fillStyle = this.color;
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
        }

        // ── HELPERS ────────────────────────────────────────────────────────────
        function initLeaves(count = 25){
            leaves = [];
            for(let i = 0; i < count; i++) leaves.push(new Leaf());
        }

        function resizeCanvas(){
            canvas.width  = window.innerWidth;
            canvas.height = window.innerHeight;
            bear.x = canvas.width  / 2 - bear.width  / 2;
            bear.y = canvas.height - 165;
        }

        function updateBellyPassUI() {
            if (!bellyPass) { bellyPassUI.style.display = 'none'; return; }
            const magnetLeft = Math.max(0, Math.ceil((magnetUntil - Date.now()) / 1000));
            let text = `Belly Pass `;
            if (shieldCharges > 0)           text += `🛡️ ${shieldCharges} `;
            if (magnetLeft > 0)              text += `🧲 ${magnetLeft}s `;
            if (doubleCoinsMultiplier === 2) text += `💰 ×2`;
            bellyPassUI.textContent = text.trim();
            bellyPassUI.style.display = 'block';
        }

        // ── PARTICLE FACTORIES ─────────────────────────────────────────────────
        function createParticles(x, y, count = 12){
            for (let i = 0; i < count; i++) particles.push(new Particle(x + 20, y + 20));
        }

        function createFireExplosion(x, y, count = 22){
            for (let i = 0; i < count; i++){
                particles.push(new Particle(x + 20, y + 10, {
                    vx: Math.random() * 9 - 4.5,
                    vy: Math.random() * -9 - 5,
                    life: 30 + Math.random() * 18,
                    color: `hsl(${10 + Math.random()*40},100%,${50+Math.random()*45}%)`,
                    size: 3 + Math.random() * 7
                }));
            }
        }

        function createShieldBlockParticles(x, y, count = 16){
            for (let i = 0; i < count; i++){
                particles.push(new Particle(x + 20, y + 10, {
                    vx: Math.random() * 7 - 3.5,
                    vy: Math.random() * -8,
                    life: 24,
                    color: `hsl(195,100%,${70+Math.random()*30}%)`,
                    size: 5
                }));
            }
        }

        function createMagnetActivateParticles(){
            const cx = bear.x + bear.width  / 2;
            const cy = bear.y + bear.height / 2;
            for (let i = 0; i < 42; i++){
                const angle = Math.random() * Math.PI * 2;
                const force = 9 + Math.random() * 11;
                particles.push(new Particle(cx, cy, {
                    vx: Math.cos(angle) * force,
                    vy: Math.sin(angle) * force - 4,
                    life: 26, color: "#00f0ff", size: 4.5
                }));
            }
        }

        // Purple-burst when jam/slow hits
        function createSlowHitParticles(x, y){
            for (let i = 0; i < 30; i++){
                particles.push(new Particle(x + 25, y + 25, {
                    vx: Math.random() * 10 - 5,
                    vy: Math.random() * -10 - 2,
                    life: 35 + Math.random() * 15,
                    color: `hsl(${270 + Math.random()*40},100%,${65+Math.random()*30}%)`,
                    size: 4 + Math.random() * 6
                }));
            }
        }

        // ── BELLY PASS LOADER ──────────────────────────────────────────────────
        async function loadBellyPass() {
            const tgUser = tg.initDataUnsafe?.user;
            if (!tgUser?.username){ bellyPass = null; magnetBtn.style.display = 'none'; return; }
            const username = tgUser.username;

            const { data } = await sb
                .from('belly_passes')
                .select('*')
                .eq('telegram_username', username)
                .eq('active', true)
                .single();

            if (!data){
                bellyPass = null; shieldCharges = 0; magnetUntil = 0; doubleCoinsMultiplier = 1;
                magnetBtn.style.display = 'none';
                updateBellyPassUI(); return;
            }

            bellyPass = data;
            shieldCharges          = bellyPass.power_ups?.shield        || 0;
            doubleCoinsMultiplier  = bellyPass.power_ups?.combo_master  === true ? 2 : 1;
            magnetUntil = 0;

            magnetBtn.style.display = bellyPass.power_ups?.coin_magnet ? 'flex' : 'none';
            updateBellyPassUI();
        }

        // ── MAGNET ACTIVATION ──────────────────────────────────────────────────
        function activateMagnet(){
            if (!bellyPass || !bellyPass.power_ups?.coin_magnet || magnetUntil > Date.now()) return;
            magnetUntil = Date.now() + 60000;
            createMagnetActivateParticles();
            magnetActivateSound.currentTime = 0;
            magnetActivateSound.play().catch(()=>{});
            updateBellyPassUI();
        }

        // ── SCORE SAVE ─────────────────────────────────────────────────────────
        async function saveScore(finalScore, coinsCaught){
            const tgUser   = tg.initDataUnsafe?.user;
            const username = tgUser?.username || tgUser?.first_name || 'Anonymous Bear';
            try {
                const { data: existing } = await sb
                    .from('highscores')
                    .select('best_score,total_coins,games_played')
                    .eq('telegram_username', username)
                    .maybeSingle();

                const newBest  = existing ? Math.max(existing.best_score || 0, finalScore) : finalScore;
                const newCoins = (existing?.total_coins  || 0) + coinsCaught;
                const newGames = (existing?.games_played || 0) + 1;

                await sb.from('highscores').upsert({
                    telegram_username: username, username,
                    best_score: newBest, total_coins: newCoins,
                    games_played: newGames, last_score: finalScore
                }, { onConflict: 'telegram_username' });
            } catch(err){ console.error("Save score error:", err); }
        }

        // ── AUDIO UNLOCK (mobile) ──────────────────────────────────────────────
        function unlockAudio(){
            ALL_AUDIO.forEach(a => {
                a.play().then(()=>{ a.pause(); a.currentTime = 0; }).catch(()=>{});
            });
        }

        // ── CONTROLS ───────────────────────────────────────────────────────────
        function setupControls(){
            const moveBear = (clientX) => {
                if (!isPlaying || isPaused) return;
                bear.x = Math.max(0, Math.min(canvas.width - bear.width, clientX - bear.width / 2));
            };

            canvas.addEventListener("touchmove", (e) => {
                e.preventDefault();
                moveBear(e.touches[0].clientX);
            }, { passive: false });

            canvas.addEventListener("mousemove", (e) => {
                const rect = canvas.getBoundingClientRect();
                moveBear(e.clientX - rect.left);
            });

            magnetBtn.addEventListener('click', activateMagnet);
            canvas.addEventListener("touchstart", unlockAudio, { once: true });
        }

        // ── COUNTDOWN (FIX: 3 → 2 → 1) ────────────────────────────────────────
        function startCountdown(callback){
            countdownScreen.style.display = 'flex';
            let count = 3;

            function showNext(){
                if (count <= 0){
                    countdownScreen.style.display = 'none';
                    callback();
                    return;
                }
                countdownNumber.textContent = String(count);

                // Animate in
                countdownNumber.animate([
                    { transform: 'scale(0.3)', opacity: 0 },
                    { transform: 'scale(1.3)', opacity: 1, offset: 0.55 },
                    { transform: 'scale(1)',   opacity: 1 }
                ], { duration: 420, fill: 'forwards' });

                // After 650 ms animate out then show next
                setTimeout(() => {
                    countdownNumber.animate([
                        { transform: 'scale(1)',   opacity: 1 },
                        { transform: 'scale(1.8)', opacity: 0 }
                    ], { duration: 260, fill: 'forwards' });

                    count--;
                    setTimeout(showNext, 300);
                }, 650);
            }

            showNext();
        }

        // ── RESET ──────────────────────────────────────────────────────────────
        function resetGameState(){
            if (spawnTimer)  clearInterval(spawnTimer);
            if (animFrameId) cancelAnimationFrame(animFrameId);

            isPlaying = false; isPaused = false;
            score = caughtCoins = combo = 0;
            level = 1; speed = 3.5; spawnInterval = 850;
            slowMotionUntil = 0; magnetUntil = 0;
            items = []; particles = []; floatingTexts = [];

            bear.currentImg = bear.imgPending;
            scoreDisplay.textContent = "Score: 0";
            levelDisplay.textContent = "Level 1";
            comboDisplay.style.display = 'none';
            pauseBtn.textContent = '⏸';
            slowOverlay.style.display = 'none';
        }

        // ── START GAME ─────────────────────────────────────────────────────────
        async function startActualGame(){
            resetGameState();
            resizeCanvas();
            initLeaves(25);

            gameOverOverlay.style.display = 'none';
            ingameUI.style.display = 'block';
            canvas.style.opacity = "1";

            isPlaying = true;
            spawnTimer = setInterval(spawnItem, spawnInterval);
            bear.currentImg = bear.imgPending;

            await loadBellyPass();
            updateBellyPassUI();

            bgMusic.play().catch(()=>{});
            animFrameId = requestAnimationFrame(update);
        }

        // ── SPAWN ──────────────────────────────────────────────────────────────
        function spawnItem(){
            if (!isPlaying || isPaused) return;
            const rand = Math.random();
            let type = 'coin';
            if      (rand < 0.25) type = 'bomb';
            else if (rand < 0.32) type = 'slow';
            items.push({ x: Math.random() * (canvas.width - 60), y: -70, size: 50, type });
        }

        // ── DIFFICULTY ─────────────────────────────────────────────────────────
        function updateDifficulty(){
            const newLevel = Math.floor(score / 200) + 1;
            levelDisplay.textContent = `Level ${newLevel}`;
            if (newLevel !== level){
                level = newLevel;
                speed         = Math.min(3.5 + (level - 1) * 0.3, 9.5);
                spawnInterval = Math.max(850 - (level - 1) * 60, 380);
                if (spawnTimer) clearInterval(spawnTimer);
                spawnTimer = setInterval(spawnItem, spawnInterval);
            }
        }

        // ── DRAW SCENE ─────────────────────────────────────────────────────────
        function drawScene(){
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (backgroundImg.complete) ctx.drawImage(backgroundImg, 0, 0, canvas.width, canvas.height);
            else { ctx.fillStyle = "#0f2a1f"; ctx.fillRect(0, 0, canvas.width, canvas.height); }
            leaves.forEach(leaf => leaf.draw());
        }

        // ── MAIN LOOP ──────────────────────────────────────────────────────────
        function update(){
            if (!isPlaying) return;

            if (isPaused){
                drawScene();
                drawItems();
                particles.forEach(p => p.draw());
                floatingTexts.forEach(ft => ft.draw());
                ctx.drawImage(bear.currentImg, bear.x, bear.y, bear.width, bear.height);
                updateBellyPassUI();
                animFrameId = requestAnimationFrame(update);
                return;
            }

            drawScene();
            leaves.forEach(leaf => leaf.update());

            const now = Date.now();
            const isMagnetActive = now < magnetUntil;
            const isSlow         = now < slowMotionUntil;
            const currentSpeed   = isSlow ? speed * 0.45 : speed;

            // Slow overlay visibility
            slowOverlay.style.display = isSlow ? 'block' : 'none';

            // Magnet pull
            if (isMagnetActive){
                items.forEach(item => {
                    if (item.type !== 'coin') return;
                    const dx   = bear.x + bear.width/2  - (item.x + item.size/2);
                    const dy   = bear.y + bear.height/2 - (item.y + item.size/2);
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < 320 && dist > 5){ item.x += dx * 0.28; item.y += dy * 0.28; }
                });
            }

            // Items
            for (let i = items.length - 1; i >= 0; i--){
                const item = items[i];
                item.y += currentSpeed;

                if      (item.type === 'bomb') ctx.drawImage(bombImg,     item.x + 4,  item.y + 4,  44, 44);
                else if (item.type === 'slow') ctx.drawImage(slowPowerImg, item.x - 11, item.y - 11, 75, 75);
                else                           ctx.drawImage(coinImg,      item.x,      item.y,      item.size, item.size);

                const hit = item.y + item.size > bear.y &&
                            item.y             < bear.y + bear.height &&
                            item.x + item.size > bear.x &&
                            item.x             < bear.x + bear.width;

                if (hit){
                    if (item.type === 'bomb'){
                        score = Math.max(0, score - 45);
                        combo = 0;
                        bombSound.currentTime = 0; bombSound.play().catch(()=>{});
                        createFireExplosion(item.x, item.y, 22);
                        floatingTexts.push(new FloatingText(item.x, item.y, '-45', '#ff4444'));

                    } else if (item.type === 'slow'){
                        slowMotionUntil = Date.now() + 5500;
                        jamMusic.currentTime = 0; jamMusic.play().catch(()=>{});

                        // ── EFEK JAM BARU ────────────────────────────────────
                        createSlowHitParticles(item.x, item.y);
                        // Flash effect on the slow overlay
                        slowOverlay.style.display = 'block';
                        slowOverlay.animate([
                            { background: 'rgba(180,0,255,0.45)' },
                            { background: 'rgba(80,0,160,0.08)'  }
                        ], { duration: 500, fill: 'forwards' });
                        floatingTexts.push(new FloatingText(item.x + 10, item.y, '⏱ SLOW!', '#cc44ff'));

                    } else {
                        // COIN ─────────────────────────────────────────────────
                        const gained = Math.floor(15 * doubleCoinsMultiplier);
                        score += gained;
                        caughtCoins++;
                        combo++;
                        bear.currentImg = bear.imgEating;
                        setTimeout(() => { if (isPlaying) bear.currentImg = bear.imgPending; }, 220);
                        createParticles(item.x, item.y);
                        eatSound.currentTime = 0; eatSound.play().catch(()=>{});

                        // Floating text — shows ×2 badge if double coins active
                        const label = doubleCoinsMultiplier === 2
                            ? `+${gained} ×2`
                            : `+${gained}`;
                        const color = doubleCoinsMultiplier === 2 ? '#ff9f43' : '#f1c40f';
                        floatingTexts.push(new FloatingText(item.x + 5, item.y, label, color));
                    }
                    items.splice(i, 1);
                    continue;
                }

                // Missed coin
                if (item.y > canvas.height + 80){
                    if (item.type === 'coin'){
                        if (shieldCharges > 0){
                            shieldCharges--;
                            createShieldBlockParticles(item.x, item.y);
                            shieldSound.currentTime = 0; shieldSound.play().catch(()=>{});
                            updateBellyPassUI();
                        } else {
                            gameOver();
                            return;
                        }
                    }
                    items.splice(i, 1);
                    continue;
                }
            }

            // Particles
            for (let i = particles.length - 1; i >= 0; i--){
                particles[i].update(); particles[i].draw();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }

            // Floating texts
            for (let i = floatingTexts.length - 1; i >= 0; i--){
                floatingTexts[i].update(); floatingTexts[i].draw();
                if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
            }

            ctx.drawImage(bear.currentImg, bear.x, bear.y, bear.width, bear.height);

            scoreDisplay.textContent = `Score: ${score}`;
            updateDifficulty();
            updateBellyPassUI();

            comboDisplay.style.display = combo >= 3 ? 'block' : 'none';
            if (combo >= 3) comboDisplay.textContent = `Combo ×1.5`;

            animFrameId = requestAnimationFrame(update);
        }

        // Helper: draw items only (used when paused)
        function drawItems(){
            items.forEach(item => {
                if      (item.type === 'bomb') ctx.drawImage(bombImg,     item.x + 4,  item.y + 4,  44, 44);
                else if (item.type === 'slow') ctx.drawImage(slowPowerImg, item.x - 11, item.y - 11, 75, 75);
                else                           ctx.drawImage(coinImg,      item.x,      item.y,      item.size, item.size);
            });
        }

        // ── GAME OVER ──────────────────────────────────────────────────────────
        function gameOver(){
            if (!isPlaying) return;
            isPlaying = false;
            if (spawnTimer)  clearInterval(spawnTimer);
            if (animFrameId) cancelAnimationFrame(animFrameId);
            slowOverlay.style.display = 'none';

            saveScore(score, caughtCoins);

            canvas.style.opacity = "0.3";
            ingameUI.style.display = 'none';

            document.getElementById('go-score').textContent  = score;
            document.getElementById('go-coins').textContent  = caughtCoins;
            gameOverOverlay.style.display = 'flex';
        }

        function restartGame(){
            gameOverOverlay.style.display = 'none';
            canvas.style.opacity = '1';
            startCountdown(() => startActualGame());
        }

        function backToMenu(){ window.location.href = 'index.html'; }

        // ── PRELOAD (images + sounds) ──────────────────────────────────────────
        function preloadAllAssets(callback){
            const images = [bear.imgPending, bear.imgEating, coinImg, bombImg, backgroundImg, slowPowerImg];
            const total  = images.length + ALL_AUDIO.length;
            let loaded   = 0;

            function done(){
                loaded++;
                const pct = Math.floor((loaded / total) * 100);
                document.getElementById("loading-bar").style.width = pct + "%";
                document.getElementById("loading-text").textContent = `Loading ${loaded}/${total}...`;
                if (loaded === total){
                    document.getElementById("loading-text").textContent = "Game Ready!";
                    const ls = document.getElementById("loading-screen");
                    ls.style.transition = "opacity 0.5s";
                    ls.style.opacity = "0";
                    setTimeout(() => { ls.style.display = "none"; callback(); }, 500);
                }
            }

            // Images
            images.forEach(img => {
                if (img.complete && img.naturalWidth > 0) done();
                else { img.onload = done; img.onerror = done; }
            });

            // Audio — track canplaythrough (or error) for progress bar
            ALL_AUDIO.forEach(a => {
                a.load();
                const onReady = () => { a.removeEventListener('canplaythrough', onReady); a.removeEventListener('error', onReady); done(); };
                a.addEventListener('canplaythrough', onReady, { once: true });
                a.addEventListener('error',          onReady, { once: true });
                // Fallback: if already cached the event may not fire
                if (a.readyState >= 3) onReady();
            });
        }

        // ── INIT ───────────────────────────────────────────────────────────────
        window.addEventListener('DOMContentLoaded', () => {
            resizeCanvas();
            setupControls();
            preloadAllAssets(() => {
                startCountdown(() => startActualGame());
            });
        });

        pauseBtn.addEventListener('click', () => {
            isPaused = !isPaused;
            pauseBtn.textContent = isPaused ? '▶' : '⏸';
            if (isPaused) slowOverlay.style.display = 'none';
        });
    </script>
</body>
</html>
