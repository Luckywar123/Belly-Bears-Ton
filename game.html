<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Belly Bears - Game</title>

    <script src="supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script> 

    <style>
        body {
            margin: 0; padding: 0;
            background: #000;
            overflow: hidden;
            touch-action: none;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0; left: 0;
            z-index: 5;
        }
        #ingame-ui {
            display: none;
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 15;
            pointer-events: none;
        }
        .stat {
            position: absolute;
            color: white;
            font-weight: bold;
            font-size: 24px;
            text-shadow: 0 0 10px rgba(0,0,0,0.9);
            z-index: 20;
        }
        #scoreDisplay { top: 20px; left: 25px; }
        #levelDisplay { top: 20px; right: 75px; color: #f1c40f;  }
        #comboDisplay { 
            top: 65px; left: 25px; 
            font-size: 20px; color: #ffeb3b; 
            display: none; 
        }
        #countdown-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92); display: none; justify-content: center; align-items: center;
            z-index: 100; font-size: 140px; color: #f39c12; font-weight: bold;
            text-shadow: 0 0 40px #f39c12;
        }

        canvas {
            cursor: none;
            touch-action: none;
        }

    </style>
</head>
<body>

    <!-- LOADING SCREEN -->
    <div id="loading-screen" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#1a1a1a;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:200;">
        <img src="assets/ICON.png" alt="Belly Bears" style="width:130px;height:130px;margin-bottom:25px;">
        <h2 style="color:#f39c12;margin:0 0 20px 0;font-size:1.8rem;">Loading Assets...</h2>
        <div style="width:220px;height:10px;background:#333;border-radius:9999px;overflow:hidden;">
            <div id="loading-bar" style="width:0%;height:100%;background:linear-gradient(to right,#f39c12,#f1c40f);transition:width 0.4s;"></div>
        </div>
        <p id="loading-text" style="color:#aaa;margin-top:12px;font-size:1rem;">Preparing game...</p>
    </div>

    <canvas id="gameCanvas"></canvas>

    <!-- IN-GAME UI -->
    <div id="ingame-ui">
        <div class="stat" id="scoreDisplay">Score: 0</div>
        <div class="stat" id="levelDisplay">Level 1</div>
        <div class="stat" id="comboDisplay">Combo ×1.5</div>
        <button id="pauseBtn" style="position:absolute;top:20px;right:25px;font-size:32px;color:white;background:none;border:none;cursor:pointer;pointer-events:auto;">⏸</button>
    </div>

    <!-- COUNTDOWN -->
    <div id="countdown-screen"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.setHeaderColor("#1a1a1a");

        const sb = supabase.createClient(window.SUPABASE_CONFIG.URL, window.SUPABASE_CONFIG.ANON_KEY);

        let tonConnectUI = null;

        // DOM
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const ingameUI = document.getElementById("ingame-ui");
        const countdownScreen = document.getElementById("countdown-screen");
        const scoreDisplay = document.getElementById("scoreDisplay");
        const levelDisplay = document.getElementById("levelDisplay");
        const comboDisplay = document.getElementById("comboDisplay");
        const pauseBtn = document.getElementById("pauseBtn");

        // Game Variables
        let isPlaying = false, isPaused = false;
        let score = 0, caughtCoins = 0, level = 1, combo = 0, lastComboTime = 0;
        let speed = 3.5, spawnInterval = 850;
        let spawnTimer;
        let items = [], particles = [], leaves = [];
        let slowMotionUntil = 0;
        let audioUnlocked = false;

        // Audio
        const bgMusic = new Audio('assets/music-game.mp3');
        bgMusic.loop = true; bgMusic.volume = 0.75;

        const eatSound = new Audio('assets/suara-makan.m4a');
        eatSound.volume = 0.55;

        const bombSound = new Audio('assets/bom-bgm.m4a');
        bombSound.volume = 0.65;

        const jamMusic = new Audio('assets/jam-bgm.m4a');
        jamMusic.volume = 0.55;

        // Bear
        const bear = {
            x: 0, y: 0, width: 90, height: 90,
            imgPending: new Image(),
            imgEating: new Image(),
            currentImg: null
        };
        bear.imgPending.src = "assets/Beruang-pending.png";
        bear.imgEating.src = "assets/Beruang-makan.png";
        bear.currentImg = bear.imgPending;

        // Images
        const coinImg = new Image(); coinImg.src = "assets/coin.png";
        const bombImg = new Image(); bombImg.src = "assets/bom.png";
        const backgroundImg = new Image(); backgroundImg.src = "assets/Background-game.png";
        const slowPowerImg = new Image(); slowPowerImg.src = "assets/slow-power.png";

        // Leaf & Particle
        class Leaf {
            constructor(){ this.reset(); }
            reset(){
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * -canvas.height * 1.5;
                this.size = Math.random() * 9 + 4;
                this.speed = Math.random() * 1.5 + 0.5;
                this.wobble = Math.random() * Math.PI * 2;
                this.wobbleSpeed = Math.random() * 0.08 + 0.04;
                this.opacity = Math.random() * 0.5 + 0.2;
            }
            update(){
                this.y += this.speed;
                this.wobble += this.wobbleSpeed;
                this.x += Math.sin(this.wobble) * 1.6;
                if (this.y > canvas.height + 20) this.reset();
            }
            draw(){
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.translate(this.x, this.y);
                ctx.rotate(Math.sin(this.wobble) * 0.45);
                ctx.fillStyle = "#4ade80";
                ctx.beginPath();
                ctx.ellipse(0, 0, this.size, this.size * 0.58, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y){
                this.x = x; this.y = y;
                this.vx = Math.random()*6-3;
                this.vy = Math.random()*-5-2;
                this.life = 28;
                this.color = `hsl(${Math.random()*40+40},100%,70%)`;
            }
            update(){ 
                this.x += this.vx; 
                this.y += this.vy; 
                this.vy += 0.25; 
                this.life--; 
            }
            draw(){
                ctx.save();
                ctx.globalAlpha = this.life / 28;
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, 6, 6);
                ctx.restore();
            }
        }

        function initLeaves(count = 25){
            leaves = [];
            for(let i = 0; i < count; i++) leaves.push(new Leaf());
        }

        function resizeCanvas(){
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            bear.x = canvas.width / 2 - bear.width / 2;
            bear.y = canvas.height - 165;
        }

        // Unlock Audio untuk Telegram / Mobile
        function unlockAudio() {
            if (audioUnlocked) return;
            audioUnlocked = true;

            console.log("✅ Audio unlocked");

            // Unlock semua audio
            [bgMusic, eatSound, bombSound, jamMusic].forEach(audio => {
                audio.play().then(() => {
                    audio.pause();
                    audio.currentTime = 0;
                }).catch(() => {});
            });
        }

        // ====================== SAVE SCORE ======================
        async function saveScore(finalScore, coinsCaught) {
            if (!tonConnectUI || !tonConnectUI.connected) return;

            const address = tonConnectUI.account.address;
            const tgUser = tg.initDataUnsafe?.user;
            const username = tgUser?.username || tgUser?.first_name || 'Anonymous Bear';

            try {
                const { data: current } = await sb
                    .from('highscores')
                    .select('best_score, total_coins, games_played')
                    .eq('wallet_address', address)
                    .maybeSingle();

                const newBest = Math.max(current?.best_score || 0, finalScore);
                const newTotalCoins = (current?.total_coins || 0) + coinsCaught;
                const newGames = (current?.games_played || 0) + 1;

                await sb.from('highscores').upsert({
                    //wallet_address: address,
                    username: username,
                    best_score: newBest,
                    total_coins: newTotalCoins,
                    games_played: newGames,
                    updated_at: new Date().toISOString()
                }, { onConflict: 'wallet_address' });

                console.log("✅ Score saved to database");
            } catch (err) {
                console.error("Save score error:", err);
            }
        }

        // Preload Assets
        function preloadAllAssets(callback) {
            const images = [
                bear.imgPending, bear.imgEating, coinImg, bombImg,
                backgroundImg, slowPowerImg,
                {src: "assets/ICON.png"}
            ];
            const audios = [bgMusic, eatSound, bombSound, jamMusic];

            let loaded = 0;
            const total = images.length + audios.length;

            const loadingBar = document.getElementById("loading-bar");
            const loadingText = document.getElementById("loading-text");

            const checkLoaded = () => {
                loaded++;
                const percent = Math.floor((loaded / total) * 100);
                loadingBar.style.width = percent + "%";
                loadingText.textContent = `Loading assets... ${percent}%`;

                if (loaded >= total) {
                    setTimeout(() => {
                        // Sembunyikan loading screen dengan animasi
                        const loadingScreen = document.getElementById("loading-screen");
                        loadingScreen.style.opacity = "0";
                        setTimeout(() => {
                            loadingScreen.style.display = "none";
                            callback();
                        }, 400);
                    }, 300);
                }
            };

            images.forEach(item => {
                const img = item.src ? new Image() : item;
                img.onload = checkLoaded;
                img.onerror = checkLoaded;
                if (item.src) img.src = item.src;
            });

            audios.forEach(audio => {
                audio.oncanplaythrough = checkLoaded;
                audio.onerror = checkLoaded;
                audio.load();
            });
        }

     

        // ====================== START GAME ======================
        function startCountdown() {
            // Proteksi: jangan jalankan lagi kalau game sudah mulai
            if (isPlaying) return;

            countdownScreen.style.display = 'flex';
            countdownScreen.style.opacity = '1';
            let count = 3;

            const timer = setInterval(() => {
                countdownScreen.textContent = count;
                countdownScreen.style.transform = 'scale(1.75)';
                countdownScreen.style.opacity = '1';

                setTimeout(() => {
                    countdownScreen.style.transform = 'scale(0.2)';
                    countdownScreen.style.opacity = '0';
                }, 500);

                count--;

                if (count < 0) {
                    clearInterval(timer);
                    setTimeout(() => {
                        countdownScreen.style.display = 'none';

                        // Tampilkan Touch to Start Popup
                        const touchPopup = document.createElement('div');
                        touchPopup.style.cssText = `
                            position:fixed; top:0; left:0; width:100%; height:100%; 
                            background:rgba(0,0,0,0.75); z-index:90; display:flex; 
                            flex-direction:column; justify-content:center; align-items:center;
                            color:white; text-align:center;
                        `;
                        touchPopup.innerHTML = `
                            <div style="font-size:2.2rem;margin-bottom:30px;">Touch the Screen</div>
                            <div style="font-size:1.4rem;opacity:0.9;">to start playing</div>
                            <div style="margin-top:60px;font-size:4rem;opacity:0.6;">⏸</div>
                        `;
                        document.body.appendChild(touchPopup);

                        // Klik/touch popup → mulai game
                        touchPopup.addEventListener('touchstart', () => {
                            touchPopup.remove();
                            startActualGame();
                        }, { once: true });

                    }, 400);
                }
            }, 700);
        }

        function resetGameState() {
            // Hentikan semua timer
            if (spawnTimer) {
                clearInterval(spawnTimer);
                spawnTimer = null;
            }

            // Hentikan RAF loop dengan flag
            isPlaying = false;
            isPaused = false;

            // Reset semua variabel game
            score = 0;
            caughtCoins = 0;
            combo = 0;
            lastComboTime = 0;
            level = 1;
            speed = 3.5;
            spawnInterval = 850;
            slowMotionUntil = 0;
            
            items = [];
            particles = [];
            // leaves boleh dibiarkan atau di-init ulang

            // Reset bear
            bear.currentImg = bear.imgPending;
            bear.x = canvas.width / 2 - bear.width / 2;

            // Reset UI
            scoreDisplay.textContent = "Score: 0";
            levelDisplay.textContent = "Level 1";
            comboDisplay.style.display = 'none';
            
            // Pastikan pause off
            isPaused = false;
            pauseBtn.textContent = '⏸';
            
            // Hapus semua overlay yang mungkin tertinggal
            const gameOverOverlay = document.getElementById('gameOverOverlay');
            if (gameOverOverlay) gameOverOverlay.remove();

            // === HAPUS TOUCH POPUP DENGAN CARA LEBIH KUAT ===
            const allPopups = document.querySelectorAll('div[style*="position:fixed"][style*="Touch the Screen"], div[style*="touch the screen"]');
            allPopups.forEach(p => {
                if (p.parentNode) p.parentNode.removeChild(p);
            });

            // Cara ekstra aman: hapus semua elemen dengan z-index 90
            document.querySelectorAll('div').forEach(el => {
                if (el.style.zIndex === '90' || el.style.zIndex === 90) {
                    el.remove();
                }
            });

            // === HAPUS SEMUA TOUCH POPUP DENGAN CARA PALING KUAT ===
            const popups = document.querySelectorAll('div[style*="z-index: 90"], div[style*="z-index:90"]');
            popups.forEach(p => p.remove());

            // Cara ekstra: hapus berdasarkan teks
            document.querySelectorAll('div').forEach(div => {
                if (div.innerHTML.includes('Touch the Screen') || 
                    div.innerHTML.includes('to start playing')) {
                    div.remove();
                }
            });
            
            
        }

        function startActualGame() {
            countdownScreen.style.display = 'none';

            score = caughtCoins = combo = 0;
            level = 1; speed = 3.5; spawnInterval = 850;
            items = []; particles = []; slowMotionUntil = 0;

            if (isPlaying) return;

            resetGameState();   // panggil reset di sini juga

            resizeCanvas();
            initLeaves(25);

            ingameUI.style.display = 'block';
            canvas.style.opacity = "1";

            isPlaying = true;
            isPaused = false;

            spawnTimer = setInterval(spawnItem, spawnInterval);
            bear.currentImg = bear.imgPending;
            update();
            addGameControls();
        }


        function startActualGameDirect() {
            resetGameState();                    // bersihkan semua
            
            document.querySelectorAll('div').forEach(el => {
                if (el.textContent.includes('Touch the Screen') || 
                    el.style.zIndex === '90' || 
                    el.style.zIndex == 90) {
                    el.remove();
                }
            });

            countdownScreen.style.display = 'none';
            ingameUI.style.display = 'block';
            canvas.style.opacity = "1";

            resizeCanvas();
            initLeaves(25);

            isPlaying = true;
            isPaused = false;

            spawnTimer = setInterval(spawnItem, spawnInterval);
            bear.currentImg = bear.imgPending;

            update();
            addGameControls();
        }



        function addGameControls() {
            let audioUnlocked = false;

            const unlockAndPlay = () => {
                if (audioUnlocked) return;
                audioUnlocked = true;

                console.log("✅ User touched screen - unlocking audio");

                // Unlock semua audio
                [bgMusic, eatSound, bombSound, jamMusic].forEach(audio => {
                    audio.play().then(() => {
                        audio.pause();
                        audio.currentTime = 0;
                    }).catch(() => {});
                });

                // Mainkan background music
                setTimeout(() => {
                    bgMusic.currentTime = 0;
                    bgMusic.play().catch(err => {
                        console.warn("bgMusic first play failed, retrying...", err);
                        // Retry sekali lagi
                        setTimeout(() => bgMusic.play().catch(() => {}), 800);
                    });
                }, 300);

                canvas.removeEventListener('touchstart', unlockAndPlay);
            };
            
            addMouseControls();
            addKeyboardControls();


            // Unlock + play music di sentuhan pertama
            canvas.addEventListener("touchstart", unlockAndPlay, { once: true });
            canvas.addEventListener("click", unlockAndPlay, { once: true });

            // Gerakkan beruang
            canvas.addEventListener("touchmove", (e) => {
                if (!isPlaying || isPaused) return;
                bear.x = e.touches[0].clientX - (bear.width / 2);
                bear.x = Math.max(0, Math.min(canvas.width - bear.width, bear.x));
                e.preventDefault();
            }, { passive: false });

            //Mouse
            canvas.addEventListener("click", () => {
                if (!isPlaying || isPaused) return;
                const rect = canvas.getBoundingClientRect();
                bear.x = event.clientX - rect.left - (bear.width / 2);
                bear.x = Math.max(0, Math.min(canvas.width - bear.width, bear.x));
            });

            //keyboard
            canvas.addEventListener("keydown", (e) => {
                if (!isPlaying || isPaused) return;

                switch(e.key) {
                    case "ArrowLeft":
                    case "a":
                    case "A":
                        bear.x -= 35;
                        break;
                    case "ArrowRight":
                    case "d":
                    case "D":
                        bear.x += 35;
                        break;
                    case " ":  // Space = Pause
                        e.preventDefault();
                        isPaused = !isPaused;
                        pauseBtn.textContent = isPaused ? '▶' : '⏸';
                        break;
                    case "r":
                    case "R":
                        if (!isPlaying) startActualGameDirect();
                        break;
                }

                if (e.key =="ArrowLeft" || e.key =="a" || e.key =="A") {
                    bear.x -= 40;
                } else if (e.key =="ArrowRight" || e.key =="d" || e.key =="D") {
                    bear.x += 40;
                }    
                        
                bear.x = Math.max(0, Math.min(canvas.width - bear.width, bear.x));

                
            });
        }

        //=========== Mouse & Keyboard Controls (optional) ===========
        //Mouse Movement
        function addMouseControls() {
            canvas.addEventListener("mousemove", (e) => {
                if (!isPlaying || isPaused) return;
                
                const rect = canvas.getBoundingClientRect();
                bear.x = e.clientX - rect.left - (bear.width / 2);

                // Batas gerakan agar tidak keluar layar
                bear.x = Math.max(0, Math.min(canvas.width - bear.width, bear.x));
            });
            // Klik untuk interaksi tambahan
            canvas.addEventListener("click", () => {
                if (!isPlaying) return;
                // Contoh: klik untuk pause/unpause
                isPaused = !isPaused;
                pauseBtn.textContent = isPaused ? '▶️' : '⏸';
            });
        }

        function addKeyboardControls() {
            document.addEventListener("keydown", (e) => {
                if (!isPlaying) return;

                switch(e.key) {
                    case "ArrowLeft":
                    case "a":
                    case "A":
                        bear.x -= 35;  // gerak lebih cepat pakai keyboard
                        break;
                    case "ArrowRight":
                    case "d":
                    case "D":
                        bear.x += 35;
                        break;
                    case " ":  // Space = Pause
                        e.preventDefault();
                        isPaused = !isPaused;
                        pauseBtn.textContent = isPaused ? '▶' : '⏸';
                        break;
                    case "r":
                    case "R":
                        if (!isPlaying) restartGame();
                        break;
                }

                // Batasi posisi bear
                bear.x = Math.max(0, Math.min(canvas.width - bear.width, bear.x));
            });
        }

        function spawnItem() {
            if (!isPlaying || isPaused) return;
            const rand = Math.random();
            let type = 'coin';
            if (rand < 0.25) type = 'bomb';
            else if (rand < 0.32) type = 'slow';

            items.push({
                x: Math.random() * (canvas.width - 60),
                y: -70,
                size: 50,
                type: type
            });
        }

        function createParticles(x, y, count = 12) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x + 20, y + 20));
            }
        }

        function updateDifficulty() {
            const newLevel = Math.floor(score / 200) + 1;
            levelDisplay.textContent = `Level ${newLevel}`;
            if (newLevel !== level) {
                level = newLevel;
                speed = Math.min(3.5 + (level - 1) * 0.3, 9.5);
                spawnInterval = Math.max(850 - (level - 1) * 60, 380);
                if (spawnTimer) clearInterval(spawnTimer);
                spawnTimer = setInterval(spawnItem, spawnInterval);
            }
        }

        function update() {
            // Jika game sudah berhenti total → stop RAF
            if (!isPlaying) {
                return;
            }

            // PAUSE: tetap render frame terakhir supaya tidak freeze
            if (isPaused) {
                // Render ulang frame terakhir (supaya pause terlihat bagus)
                drawPauseFrame();
                requestAnimationFrame(update);
                return;
            }

            // ==================== NORMAL GAME UPDATE ====================
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (backgroundImg.complete) {
                ctx.drawImage(backgroundImg, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = "#0f2a1f";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            leaves.forEach(leaf => { leaf.update(); leaf.draw(); });

            const now = Date.now();
            const isSlow = now < slowMotionUntil;
            const currentSpeed = isSlow ? speed * 0.45 : speed;

            for (let i = items.length - 1; i >= 0; i--) {
                const item = items[i];
                item.y += currentSpeed;

                if (item.type === 'bomb') ctx.drawImage(bombImg, item.x + 4, item.y + 4, 44, 44);
                else if (item.type === 'slow') ctx.drawImage(slowPowerImg, item.x - 11, item.y - 11, 75, 75);
                else ctx.drawImage(coinImg, item.x, item.y, item.size, item.size);
                
                const itemRight = item.x + item.size;
                const itemBottom = item.y + item.size;

                if (itemBottom > bear.y && item.y < bear.y + bear.height &&
                    itemRight > bear.x && item.x < bear.x + bear.width) {

                    if (item.type === 'bomb') {
                        score = Math.max(0, score - 45);
                        combo = 0;
                        bombSound.currentTime = 0;
                        bombSound.play().catch(() => {});
                    } else if (item.type === 'slow') {
                        slowMotionUntil = now + 5500;
                        jamMusic.currentTime = 0;
                        jamMusic.play().catch(() => {});
                    } else {
                        const multiplier = (now - lastComboTime < 1200 && combo >= 2) ? 1.5 : 1;
                        score += Math.floor(15 * multiplier);
                        caughtCoins++;
                        combo++;
                        lastComboTime = now;

                        bear.currentImg = bear.imgEating;
                        setTimeout(() => { if (isPlaying) bear.currentImg = bear.imgPending; }, 220);
                        createParticles(item.x + 20, item.y + 10);

                        eatSound.currentTime = 0;
                        eatSound.play().catch(() => {});
                    }
                    items.splice(i, 1);
                    continue;
                }

                if (item.y > canvas.height + 80) {
                    if (item.type === 'coin') {
                        gameOver();
                        return;
                    }
                    items.splice(i, 1);
                }
            }

            // Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }
            if (particles.length > 25) particles.length = 25;

            ctx.drawImage(bear.currentImg, bear.x, bear.y, bear.width, bear.height);

            scoreDisplay.textContent = `Score: ${score}`;
            updateDifficulty();

            if (combo >= 3) {
                comboDisplay.style.display = 'block';
                comboDisplay.textContent = `Combo ×1.5`;
            } else {
                comboDisplay.style.display = 'none';
            }

            requestAnimationFrame(update);
        }

        // Fungsi helper untuk render saat pause
        function drawPauseFrame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (backgroundImg.complete) {
                ctx.drawImage(backgroundImg, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = "#0f2a1f";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            leaves.forEach(leaf => leaf.draw());  // hanya draw, tidak update

            // Draw items tanpa gerak
            items.forEach(item => {
                if (item.type === 'bomb') ctx.drawImage(bombImg, item.x + 4, item.y + 4, 44, 44);
                else if (item.type === 'slow') ctx.drawImage(slowPowerImg, item.x - 11, item.y - 11, 75, 75);
                else ctx.drawImage(coinImg, item.x, item.y, item.size, item.size);
            });

            particles.forEach(p => p.draw());

            ctx.drawImage(bear.currentImg, bear.x, bear.y, bear.width, bear.height);

            scoreDisplay.textContent = `Score: ${score}`;
        }

        function gameOver() {
            // HENTIKAN SEMUA AKTIVITAS GAME
            if (!isPlaying) return;
            bgMusic.currentTime = 0;

            isPlaying = false;
            if (spawnTimer) {
                clearInterval(spawnTimer);
                spawnTimer = null;
            }

            // Simpan score ke database
            saveScore(score, caughtCoins);

            canvas.style.opacity = "0.3";

            setTimeout(() => {
                // Buat overlay Game Over
                const gameOverHTML = `
                    <div id="gameOverOverlay" style="position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);z-index:100;display:flex;flex-direction:column;justify-content:center;align-items:center;color:white;text-align:center;">
                        <h1 style="font-size:3.2rem;color:#f39c12;margin:0 0 20px 0;">GAME OVER</h1>
                        <p style="font-size:1.6rem;margin:10px 0;">Final Score</p>
                        <p style="font-size:4rem;font-weight:bold;color:#f1c40f;margin:0 0 30px 0;">${score}</p>
                        <p style="font-size:1.3rem;margin-bottom:40px;">Coins Caught: ${caughtCoins}</p>
                        
                        <div style="display:flex;gap:20px;">
                            <button onclick="restartGame()" 
                                    style="padding:14px 32px;font-size:1.2rem;background:#f39c12;color:black;border:none;border-radius:12px;cursor:pointer;">
                                PLAY AGAIN
                            </button>
                            <button onclick="backToMenu()" 
                                    style="padding:14px 32px;font-size:1.2rem;background:#555;color:white;border:none;border-radius:12px;cursor:pointer;">
                                BACK TO MENU
                            </button>
                        </div>
                    </div>
                `;

                const overlay = document.createElement('div');
                overlay.innerHTML = gameOverHTML;
                document.body.appendChild(overlay.firstElementChild);
            }, 300);
        }

        // Fungsi tambahan untuk tombol
        function restartGame() {
            // Hapus semua overlay yang mungkin masih ada
            const overlay = document.getElementById('gameOverOverlay');
            if (overlay) overlay.remove();

            // Langsung mulai game tanpa countdown dan tanpa "Touch the Screen"
            setTimeout(() => {
                startActualGameDirect();   // kita buat fungsi baru
            }, 200);
        }

        function backToMenu() {
            window.location.href = 'index.html';
        }

        pauseBtn.addEventListener('click', () => {
            isPaused = !isPaused;
            pauseBtn.textContent = isPaused ? '▶' : '⏸';
        });

        // INIT GAME
        document.addEventListener('DOMContentLoaded', () => {
            resizeCanvas();

            // Tampilkan loading screen
            const loadingScreen = document.getElementById("loading-screen");
            loadingScreen.style.display = "flex";
            loadingScreen.style.opacity = "1";

            preloadAllAssets(() => {
                setTimeout(() => {
                    startCountdown();
                }, 600);
            });
        });
    </script>
</body>
</html>
