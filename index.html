<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Belly Bears</title>

    <script src="supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

    <!-- Preload -->
    <link rel="preload" as="image" href="assets/Background-game.png">
    <link rel="preload" as="image" href="assets/Beruang-pending.png">
    <link rel="preload" as="image" href="assets/coin.png">
    <link rel="preload" as="image" href="assets/start-eating.png">
    <link rel="preload" as="image" href="assets/Dashboard.png">

    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: url('assets/background-dashboard.png') no-repeat center center fixed;
            background-size: cover;
            position: relative;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            z-index: -1;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0; left: 0;
            z-index: 5;
            touch-action: none;
        }

        #ui-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
            transition: opacity 0.45s ease-out;
        }

        #ui-layer > * { pointer-events: auto; }

        #gameCanvas {
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        #ingame-ui { 
            display: none; 
            position: absolute; top: 0; left: 0; 
            width: 100%; height: 100%; 
            z-index: 15; pointer-events: none; 
        }

        .stat { 
            position: absolute; color: white; font-weight: bold; 
            font-size: 24px; text-shadow: 0 0 10px rgba(0,0,0,0.9); z-index: 20; 
        }
        #scoreDisplay { top: 20px; left: 25px; }
        #levelDisplay { top: 20px; right: 25px; color: #f1c40f; }
        #comboDisplay { 
            top: 65px; left: 25px; font-size: 20px; 
            color: #ffeb3b; display: none; 
        }

        #countdown-screen {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
            font-size: 140px;
            color: #f39c12;
            font-weight: bold;
            text-shadow: 0 0 30px #f39c12;
            transition: transform 0.4s ease-out, opacity 0.35s ease-out;
        }

        #loading-screen {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.6s ease;
        }
    </style>
</head>

<body>

    <!-- LOADING -->
    <div id="loading-screen">
        <img src="assets/ICON.png" alt="Belly Bears" style="width:130px;height:130px;margin-bottom:25px;">
        <h2 style="color:#f39c12;margin:0 0 20px;font-size:1.8rem;">Loading Assets...</h2>
        <div style="width:220px;height:10px;background:#333;border-radius:9999px;overflow:hidden;">
            <div id="loading-bar" style="width:0%;height:100%;background:linear-gradient(to right,#f39c12,#f1c40f);transition:width 0.4s;"></div>
        </div>
        <p id="loading-text" style="color:#aaa;margin-top:12px;font-size:1rem;">Preparing game...</p>
    </div>

    <!-- COUNTDOWN -->
    <div id="countdown-screen"></div>

    <canvas id="gameCanvas"></canvas>

    <!-- MENU -->
    <div id="ui-layer">
        <h1 id="title" style="color:#f39c12;text-align:center;margin:40px 0 10px 0;font-size:2.8rem;">BELLY BEARS</h1>
        <p id="desc" style="text-align:center;color:#ddd;margin-bottom:20px;font-size:1.1rem;">Catch the coins, don't let them escape!</p>
        
        <div id="ton-connect-button" style="margin:20px auto;text-align:center;"></div>
        
        <button id="startBtn" style="background:none;border:none;padding:0;margin:15px auto 20px;display:block;cursor:pointer;">
            <img src="assets/start-eating.png" alt="Start Eating" style="width:85%;max-width:290px;height:auto;">
        </button>
        
        <button onclick="window.location.href='dashboard.html'" style="background:none;border:none;padding:0;margin:10px auto;display:block;cursor:pointer;">
            <img src="assets/Dashboard.png" alt="Dashboard" style="width:85%;max-width:270px;height:auto;border-radius:12px;">
        </button>

        <div id="finalScoreContainer" style="display:none;text-align:center;margin-top:30px;">
            <p id="finalScoreEl" style="color:#f1c40f;font-size:1.8rem;margin:0;font-weight:bold;text-shadow:0 0 10px rgba(0,0,0,0.9);"></p>
        </div>
    </div>

    <!-- IN-GAME UI -->
    <div id="ingame-ui">
        <div class="stat" id="scoreDisplay">Score: 0</div>
        <div class="stat" id="levelDisplay">Level 1</div>
        <div class="stat" id="comboDisplay">Combo ×1.5</div>
        <button id="pauseBtn" style="position:absolute;top:20px;right:25px;font-size:32px;color:white;background:none;border:none;cursor:pointer;pointer-events:auto;">⏸</button>
    </div>

    <!-- FOOTER -->
    <footer id="gameFooter" style="position:fixed;bottom:10px;width:100%;text-align:center;color:#888;font-size:0.9rem;z-index:50;display:block;">
        © 2024 Belly Bears. All rights reserved.
        <div style="position:absolute;bottom:20px;width:100%;text-align:center;font-size:10px;color:#888;">
            Music: "Carefree" & "Sneaky Snitch" by Kevin MacLeod (CC BY 4.0)
        </div>
    </footer>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.setHeaderColor("#1a1a1a");

        const sb = supabase.createClient(window.SUPABASE_CONFIG.URL, window.SUPABASE_CONFIG.ANON_KEY);

        let tonConnectUI = null;

        // DOM Elements
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const uiLayer = document.getElementById("ui-layer");
        const ingameUI = document.getElementById("ingame-ui");
        const startBtn = document.getElementById("startBtn");
        const titleEl = document.getElementById("title");
        const scoreDisplay = document.getElementById("scoreDisplay");
        const levelDisplay = document.getElementById("levelDisplay");
        const comboDisplay = document.getElementById("comboDisplay");
        const pauseBtn = document.getElementById("pauseBtn");
        const countdownScreen = document.getElementById("countdown-screen");
        const finalScoreContainer = document.getElementById("finalScoreContainer");
        const finalScoreEl = document.getElementById("finalScoreEl");
        const loadingScreen = document.getElementById("loading-screen");
        const loadingBar = document.getElementById("loading-bar");
        const loadingText = document.getElementById("loading-text");

        // Game Variables
        let isPlaying = false, isPaused = false;
        let score = 0, caughtCoins = 0, level = 1, combo = 0, lastComboTime = 0;
        let speed = 3.5, spawnInterval = 850;
        let spawnTimer, items = [], particles = [], leaves = [], slowMotionUntil = 0;


        // Audio
        const bgMusic = new Audio('assets/music-game.m4a');
        bgMusic.loop = true; bgMusic.volume = 0.75;

        const eatSound = new Audio('assets/suara-makan.m4a');
        eatSound.volume = 0.55;

        const bombSound = new Audio('assets/bom-bgm.m4a');
        bombSound.volume = 0.65;

        const menuMusic = new Audio('assets/bgm.m4a');
        menuMusic.loop = true; menuMusic.volume = 0.65;

        const jamMusic = new Audio('assets/jam-bgm.m4a');
        jamMusic.volume = 0.55;

        // Bear
        const bear = {
            x: 0, y: 0, width: 90, height: 90,
            imgPending: new Image(),
            imgEating: new Image(),
            currentImg: null
        };
        bear.imgPending.src = "assets/Beruang-pending.png";
        bear.imgEating.src = "assets/Beruang-makan.png";
        bear.currentImg = bear.imgPending;

        // Images
        const coinImg = new Image(); coinImg.src = "assets/coin.png";
        const bombImg = new Image(); bombImg.src = "assets/bom.png";
        const backgroundImg = new Image(); backgroundImg.src = "assets/Background-game.png";
        const slowPowerImg = new Image(); slowPowerImg.src = "assets/slow-power.png";

        class Leaf {  
            constructor(){ this.reset(); }
            reset(){
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * -canvas.height * 1.5;
                this.size = Math.random() * 9 + 4;
                this.speed = Math.random() * 1.5 + 0.5;
                this.wobble = Math.random() * Math.PI * 2;
                this.wobbleSpeed = Math.random() * 0.08 + 0.04;
                this.opacity = Math.random() * 0.5 + 0.2;
            }
            update(){
                this.y += this.speed;
                this.wobble += this.wobbleSpeed;
                this.x += Math.sin(this.wobble) * 1.6;
                if (this.y > canvas.height + 20) this.reset();
            }
            draw(){
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.translate(this.x, this.y);
                ctx.rotate(Math.sin(this.wobble) * 0.45);
                ctx.fillStyle = "#4ade80";
                ctx.beginPath();
                ctx.ellipse(0, 0, this.size, this.size * 0.58, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y){
                this.x = x; this.y = y;
                this.vx = Math.random()*6-3;
                this.vy = Math.random()*-5-2;
                this.life = 28;
                this.color = `hsl(${Math.random()*40+40},100%,70%)`;
            }
            update(){ 
                this.x += this.vx; 
                this.y += this.vy; 
                this.vy += 0.25; 
                this.life--; 
            }
            draw(){
                ctx.save();
                ctx.globalAlpha = this.life / 28;
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, 6, 6);
                ctx.restore();
            }
        }

        function initLeaves(count = 25){
            leaves = [];
            for(let i = 0; i < count; i++) leaves.push(new Leaf());
        }

        function resizeCanvas(){
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            bear.x = canvas.width / 2 - bear.width / 2;
            bear.y = canvas.height - 165;
        }

        // ====================== PRELOAD ======================
        let totalAssets = 0, loadedAssets = 0;
        function preloadAllAssets() {
            const images = [bear.imgPending, bear.imgEating, coinImg, bombImg, backgroundImg, slowPowerImg,
                           {src:"assets/ICON.png"}, {src:"assets/start-eating.png"}, {src:"assets/Dashboard.png"}];
            const audios = [menuMusic, bgMusic, eatSound, bombSound, jamMusic];

            totalAssets = images.length + audios.length;
            loadedAssets = 0;

            images.forEach(item => {
                const img = item.src ? new Image() : item;
                img.onload = assetLoaded;
                img.onerror = () => { console.warn("Image failed"); assetLoaded(); };
                if (item.src) img.src = item.src;
            });

            audios.forEach(audio => {
                audio.oncanplaythrough = assetLoaded;
                audio.onerror = () => { console.warn("Audio failed"); assetLoaded(); };
                audio.load();
            });
        }

        function assetLoaded() {
            loadedAssets++;
            const percent = Math.min(100, Math.floor((loadedAssets / totalAssets) * 100));
            loadingBar.style.width = percent + "%";
            loadingText.textContent = `Loading assets... ${percent}%`;

            if (loadedAssets >= totalAssets) {
                setTimeout(() => {
                    loadingScreen.style.opacity = "0";
                    setTimeout(() => {
                        loadingScreen.style.display = "none";
                        uiLayer.style.display = "block";
                        uiLayer.style.opacity = "1";
                        menuMusic.play().catch(() => {});
                    }, 400);
                }, 300);
            }
        }

        // TON Connect
        async function initTonConnect() {
            if (tonConnectUI) return;
            try {
                tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
                    manifestUrl: 'https://belly-bears-ton-q9b3.vercel.app/tonconnect-manifest.json',
                    buttonRootId: 'ton-connect-button',
                    uiPreferences: { theme: 'DARK', language: 'en' }
                });
                await tonConnectUI.connectionRestored;
            } catch (e) { console.error("TON Connect error:", e); }
        }

         // ====================== START GAME ======================
        startBtn.addEventListener("click", async () => {
            if (!tonConnectUI || !tonConnectUI.connected) {
                alert("⚠️ Please connect your TON wallet first!");
                return;
            }

            titleEl.innerText = "BELLY BEARS";
            finalScoreContainer.style.display = 'none';

            // Hilangkan menu dengan tegas
            uiLayer.style.transition = "opacity 0.5s ease-out";
            uiLayer.style.opacity = "0";

            setTimeout(() => {
                uiLayer.style.display = "none";
                uiLayer.style.opacity = "1";   // reset untuk next time
                startCountdown();
            }, 520);
        });

        function startCountdown() {
            countdownScreen.style.display = 'flex';
            let count = 3;
            const timer = setInterval(() => {
                countdownScreen.textContent = count;
                countdownScreen.style.transform = 'scale(1.8)';
                countdownScreen.style.opacity = '1';

                setTimeout(() => {
                    countdownScreen.style.transform = 'scale(0.4)';
                    countdownScreen.style.opacity = '0';
                }, 380);

                count--;
                if (count < 0) {
                    clearInterval(timer);
                    setTimeout(startActualGame, 300);
                }
            }, 820);
        }

        function startActualGame() {
            // Reset game
            score = caughtCoins = combo = 0;
            level = 1; speed = 3.5; spawnInterval = 850;
            items = []; particles = []; slowMotionUntil = 0;

            resizeCanvas();
            initLeaves(25);

            // PASTIKAN MENU MATI & GAME HIDUP
            uiLayer.style.display = "none";
            ingameUI.style.display = 'block';
            canvas.style.opacity = "1";

            bear.currentImg = bear.imgPending;
            isPlaying = true;
            isPaused = false;

            if (spawnTimer) clearInterval(spawnTimer);
            spawnTimer = setInterval(spawnItem, spawnInterval);

            update();
            addGameControls();

            // Music switch
            menuMusic.pause();
            menuMusic.currentTime = 0;
            bgMusic.currentTime = 0;
            bgMusic.play().catch(() => {});
        }

        function addGameControls() {
            canvas.addEventListener("touchmove", e => {
                if (!isPlaying || isPaused) return;
                bear.x = e.touches[0].clientX - bear.width/2;
                bear.x = Math.max(0, Math.min(canvas.width - bear.width, bear.x));
                e.preventDefault();
            }, {passive:false});
        }

       // ====================== GAME LOGIC ======================
        function updateDifficulty() {
            const newLevel = Math.floor(score / 200) + 1;
            levelDisplay.textContent = `Level ${newLevel}`;
            if (newLevel !== level) {
                level = newLevel;
                speed = Math.min(3.5 + (level - 1) * 0.3, 9.5);
                spawnInterval = Math.max(850 - (level - 1) * 60, 380);
                if (spawnTimer) clearInterval(spawnTimer);
                spawnTimer = setInterval(spawnItem, spawnInterval);
            }
        }

        function spawnItem() {
            if (!isPlaying || isPaused) return;
            const rand = Math.random();
            let type = 'coin';
            if (rand < 0.25) type = 'bomb';
            else if (rand < 0.32) type = 'slow';
            items.push({ x: Math.random() * (canvas.width - 60), y: -70, size: 50, type: type });
        }

        function createParticles(x, y, count = 12) {
            for (let i = 0; i < count; i++) particles.push(new Particle(x + 20, y + 20));
        }

        function update() {
            if (!isPlaying) return;
            if (isPaused) { requestAnimationFrame(update); return; }

            ctx.clearRect(0,0,canvas.width,canvas.height);

            if (backgroundImg.complete) ctx.drawImage(backgroundImg,0,0,canvas.width,canvas.height);
            else { ctx.fillStyle="#0f2a1f"; ctx.fillRect(0,0,canvas.width,canvas.height); }

            leaves.forEach(l => { l.update(); l.draw(); });

            const now = Date.now();
            const isSlow = now < slowMotionUntil;
            const currentSpeed = isSlow ? speed*0.45 : speed;

            for (let i = items.length-1; i >= 0; i--) {
                const item = items[i];
                item.y += currentSpeed;

                if (item.type === 'bomb') ctx.drawImage(bombImg, item.x+4, item.y+4, 44,44);
                else if (item.type === 'slow') ctx.drawImage(slowPowerImg, item.x-11, item.y-11,75,75);
                else ctx.drawImage(coinImg, item.x, item.y, item.size, item.size);

                if (item.y + 45 > bear.y && item.x + 40 > bear.x && item.x < bear.x + bear.width) {
                    if (item.type === 'bomb') {
                        score = Math.max(0, score-45); combo = 0;
                        bombSound.currentTime = 0; bombSound.play().catch(()=>{});
                    } else if (item.type === 'slow') {
                        slowMotionUntil = now + 5500;
                        jamMusic.currentTime = 0; jamMusic.play().catch(()=>{});
                    } else {
                        const mul = (now - lastComboTime < 1200 && combo >= 2) ? 1.5 : 1;
                        score += Math.floor(15 * mul);
                        caughtCoins++; combo++; lastComboTime = now;
                        bear.currentImg = bear.imgEating;
                        setTimeout(()=>{ if(isPlaying) bear.currentImg = bear.imgPending; },220);
                        createParticles(item.x+20, item.y+10);
                        eatSound.currentTime = 0; eatSound.play().catch(()=>{});
                    }
                    items.splice(i,1); continue;
                }

                if (item.y > canvas.height + 80) {
                    if (item.type === 'coin') { gameOver(); return; }
                    items.splice(i,1);
                }
            }

            for (let i = particles.length-1; i >= 0; i--) {
                particles[i].update(); particles[i].draw();
                if (particles[i].life <= 0) particles.splice(i,1);
            }

            ctx.drawImage(bear.currentImg, bear.x, bear.y, bear.width, bear.height);

            scoreDisplay.textContent = `Score: ${score}`;
            updateDifficulty();

            comboDisplay.style.display = combo >= 3 ? 'block' : 'none';
            if (combo >= 3) comboDisplay.textContent = `Combo ×1.5`;

            requestAnimationFrame(update);
        }

        function gameOver() {
            bgMusic.pause(); bgMusic.currentTime = 0;
            menuMusic.play().catch(()=>{});

            isPlaying = false;
            if (spawnTimer) clearInterval(spawnTimer);

            canvas.style.opacity = "0";

            setTimeout(() => {
                ingameUI.style.display = 'none';
                uiLayer.style.display = "block";
                uiLayer.style.opacity = "1";
                titleEl.innerText = "GAME OVER!";
                finalScoreContainer.style.display = 'block';
                finalScoreEl.innerText = `Final Score: ${score}`;
                saveScore(score, caughtCoins);
            }, 400);
        }

        pauseBtn.addEventListener('click', () => {
            isPaused = !isPaused;
            pauseBtn.textContent = isPaused ? '▶' : '⏸';
        });

        async function saveScore(finalScore, coinsCaught) {
            if (!tonConnectUI || !tonConnectUI.connected) return;
            const address = tonConnectUI.account.address;
            const tgUser = tg.initDataUnsafe?.user;
            const username = tgUser?.username || tgUser?.first_name || 'Anonymous Bear';

            try {
                const { data: current } = await sb.from('highscores').select('best_score, total_coins, games_played')
                    .eq('wallet_address', address).maybeSingle();

                const newBest = Math.max(current?.best_score || 0, finalScore);
                const newTotalCoins = (current?.total_coins || 0) + coinsCaught;
                const newGames = (current?.games_played || 0) + 1;

                await sb.from('highscores').upsert({
                    wallet_address: address,
                    username: username,
                    best_score: newBest,
                    total_coins: newTotalCoins,
                    games_played: newGames,
                    updated_at: new Date().toISOString()
                }, { onConflict: 'wallet_address' });
            } catch (err) {
                console.error("Save score error:", err);
            }
        }

        // ====================== INIT ======================
        document.addEventListener('DOMContentLoaded', () => {
            resizeCanvas();
            initTonConnect();
            
            // PASTIKAN IN-GAME UI MATI DI AWAL
            ingameUI.style.display = 'none';
            
            loadingScreen.style.display = "flex";
            preloadAllAssets();
        });
        window.addEventListener('resize', resizeCanvas);
    </script>
</body>
</html>
