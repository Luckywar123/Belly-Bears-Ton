<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Belly Bears - Telegram Game</title>

    <!-- CSS -->
    <link rel="stylesheet" href="game.css">
    
    <!-- SUPABASE CONFIG -->
    <script src="supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- TON Connect Library -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
</head>

<body>

    <!-- LOADING SCREEN (hidden by default) -->
    <div id="loading-screen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a1a; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100;">
        <img src="assets/ICON.png" alt="Belly Bears" style="width: 120px; height: 120px; margin-bottom: 20px;">
        <h2 style="color: #f39c12; margin: 0 0 15px 0;">Loading Assets...</h2>
        <div style="width: 200px; height: 8px; background: #333; border-radius: 10px; overflow: hidden;">
            <div id="loading-bar" style="width: 0%; height: 100%; background: #f39c12; transition: width 0.3s;"></div>
        </div>
        <p id="loading-text" style="color: #aaa; margin-top: 10px; font-size: 0.95rem;">Preparing game...</p>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer" style="display: none;">
        <!-- isi ui-layer kamu tetap sama -->
        <h1 id="title" style="color:#f39c12;">BELLY BEARS</h1>
        <p id="desc">Catch the coins, don't let them escape!</p>
        <h2 id="finalScore" class="hidden">Final Score: 0</h2>
        
        <div id="ton-connect-button"></div>
        
        <!-- Tombol Start Eating -->
        <button id="startBtn" style="background: none; border: none; padding: 0; margin: 15px auto 10px; display: block; cursor: pointer;">
            <img src="assets/start-eating.png" alt="Start Eating" style="width: 85%; max-width: 280px; height: auto;">
        </button>
        
        <button onclick="window.location.href='dashboard.html'" 
                style="background: none; border: none; padding: 0; margin: 20px auto 10px; display: block; cursor: pointer;">
            <img src="assets/Dashboard.png" alt="Dashboard" style="width: 85%; max-width: 260px; height: auto; border-radius: 12px;">
        </button>
    </div>

   

    <!-- ==================== MAIN SCRIPT ==================== -->
<script>
    // Telegram Web App setup
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    tg.setHeaderColor("#1a1a1a");

    const sb = supabase.createClient(
        window.SUPABASE_CONFIG.URL, 
        window.SUPABASE_CONFIG.ANON_KEY
    );

    let tonConnectUI = null;



        // Loading Management
    let imagesLoaded = 0;
    const totalImages = 6; // Beruang pending, eating, coin, bom, start-eating, dashboard

    function updateLoadingProgress() {
        const percent = Math.floor((imagesLoaded / totalImages) * 100);
        document.getElementById('loading-bar').style.width = percent + '%';
        document.getElementById('loading-text').textContent = `Loading... ${percent}%`;
    }

    function checkAllImagesLoaded() {
        imagesLoaded++;
        updateLoadingProgress();

        if (imagesLoaded >= totalImages) {
            setTimeout(() => {
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('ui-layer').style.display = 'block';
                console.log("✅ All assets loaded successfully");
            }, 600);
        }
    }

    // ==================== GAME SETUP ====================
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const uiLayer = document.getElementById("ui-layer");
    const startBtn = document.getElementById("startBtn");
    const finalScoreEl = document.getElementById("finalScore");
    const titleEl = document.getElementById("title");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let isPlaying = false;
    let score = 0;
    let caughtCoins = 0;
    let items = [];
    let speed = 3.5;
    let spawnTimer;

    // Bear Images
    const bear = {
        x: canvas.width / 2 - 45,
        y: canvas.height - 150,
        width: 90,
        height: 90,
        imgPending: new Image(),
        imgEating: new Image(),
        currentImg: null
    };

    bear.imgPending.src = "assets/Beruang-pending.png";
    bear.imgEating.src = "assets/Beruang-makan.png";
    bear.imgPending.onload = checkAllImagesLoaded;
    bear.imgEating.onload = checkAllImagesLoaded;
    bear.currentImg = bear.imgPending;

    // Item Images
    coinImg.src = "assets/coin.png";
    bombImg.src = "assets/bom.png";
    coinImg.onload = checkAllImagesLoaded;
    bombImg.onload = checkAllImagesLoaded;


    // Tombol Images (opsional tapi bagus)
    const startEatingImg = new Image();
    startEatingImg.src = "assets/start-eating.png";
    startEatingImg.onload = checkAllImagesLoaded;

    const dashboardImg = new Image();
    dashboardImg.src = "assets/Dashboard.png";
    dashboardImg.onload = checkAllImagesLoaded;


    // Wait for critical images to load before allowing game to start
    let imagesLoaded = 0;
    const totalCriticalImages = 4;

    function checkImagesLoaded() {
        imagesLoaded++;
        if (imagesLoaded === totalCriticalImages) {
            console.log("✅ All critical images loaded");
            updateStartButton();
        }
    }

    bear.imgPending.onload = checkImagesLoaded;
    bear.imgEating.onload = checkImagesLoaded;
    coinImg.onload = checkImagesLoaded;
    bombImg.onload = checkImagesLoaded;

    // ====================== TON CONNECT ======================
    async function initTonConnect() {
        if (tonConnectUI) return;
        try {
            tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
                manifestUrl: 'https://belly-bears-ton-q9b3.vercel.app/tonconnect-manifest.json',
                buttonRootId: 'ton-connect-button',
                uiPreferences: { theme: 'DARK', language: 'en' }
            });

            await tonConnectUI.connectionRestored;
            tonConnectUI.onStatusChange(() => updateStartButton());
            updateStartButton();
        } catch (e) {
            console.error("TON Connect failed:", e);
        }
    }

    // ====================== GAME LOGIC ======================
    function startGame() {
        if (!tonConnectUI || !tonConnectUI.connected) {
            alert("Please connect your TON wallet first!");
            return;
        }

        isPlaying = true;
        score = 0;
        caughtCoins = 0;
        speed = 3.5;
        items = [];
        uiLayer.classList.add("hidden");
        bear.currentImg = bear.imgPending;

        if (spawnTimer) clearInterval(spawnTimer);
        spawnTimer = setInterval(spawnItem, 850);
        update();
    }

    function spawnItem() {
        if (!isPlaying) return;
        const isBomb = Math.random() < 0.28;

        items.push({
            x: Math.random() * (canvas.width - 60),
            y: -60,
            size: 48,
            isBomb: isBomb
        });
    }

    function update() {
        if (!isPlaying) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Bear
        ctx.drawImage(bear.currentImg, bear.x, bear.y, bear.width, bear.height);

        // Update & Draw Items
        for (let i = items.length - 1; i >= 0; i--) {
            let item = items[i];
            item.y += speed;

            if (item.isBomb) {
                // Gunakan bombImg dengan pengecekan aman
                if (bombImg.complete) {
                    ctx.drawImage(bombImg, item.x - 8, item.y - 8, item.size + 16, item.size + 16);
                }
            } else {
                if (coinImg.complete) {
                    ctx.drawImage(coinImg, item.x, item.y, item.size, item.size);
                }
            }

            // Collision
            if (item.y + 40 > bear.y && item.x + 40 > bear.x && item.x < bear.x + bear.width) {
                if (item.isBomb) {
                    score = Math.max(0, score - 40);
                } else {
                    score += 15;
                    caughtCoins += 1;
                    bear.currentImg = bear.imgEating;
                    setTimeout(() => {
                        if (isPlaying) bear.currentImg = bear.imgPending;
                    }, 280);
                }
                items.splice(i, 1);
                continue;
            }

            // Miss
            if (item.y > canvas.height + 50) {
                if (!item.isBomb) {
                    gameOver();
                    return;
                }
                items.splice(i, 1);
            }
        }

        // Draw Score
        ctx.fillStyle = "white";
        ctx.font = "bold 28px Arial";
        ctx.fillText("Score: " + score, 30, 65);

        requestAnimationFrame(update);
    }

    function gameOver() {
        isPlaying = false;
        clearInterval(spawnTimer);
        uiLayer.classList.remove("hidden");
        
        titleEl.innerText = "GAME OVER!";
        finalScoreEl.innerText = "Final Score: " + score;
        finalScoreEl.classList.remove("hidden");

        saveScore(score, caughtCoins);
    }

    // ====================== SAVE SCORE ======================
    async function saveScore(finalScore, coinsCaught) {
        if (!tonConnectUI || !tonConnectUI.connected) return;
        // ... (kode saveScore kamu tetap sama)
        const address = tonConnectUI.account.address;
        const tgUser = tg.initDataUnsafe?.user;
        const username = tgUser?.username || tgUser?.first_name || 'Anonymous Bear';

        try {
            const { data: current } = await sb
                .from('highscores')
                .select('best_score, total_coins, games_played')
                .eq('wallet_address', address)
                .maybeSingle();

            const newBest = Math.max(current?.best_score || 0, finalScore);
            const newTotalCoins = (current?.total_coins || 0) + coinsCaught;
            const newGames = (current?.games_played || 0) + 1;

            await sb.from('highscores').upsert({
                wallet_address: address,
                username: username,
                best_score: newBest,
                total_coins: newTotalCoins,
                games_played: newGames,
                updated_at: new Date().toISOString()
            }, { onConflict: 'wallet_address' });
        } catch (err) {
            console.error("Error saving score:", err);
        }
    }

    // ====================== INPUT ======================
    canvas.addEventListener("touchmove", (e) => {
        if (!isPlaying) return;
        bear.x = e.touches[0].clientX - (bear.width / 2);
        bear.x = Math.max(0, Math.min(canvas.width - bear.width, bear.x));
        e.preventDefault();
    }, { passive: false });

    canvas.addEventListener("mousemove", (e) => {
        if (!isPlaying) return;
        bear.x = e.clientX - (bear.width / 2);
        bear.x = Math.max(0, Math.min(canvas.width - bear.width, bear.x));
    });

    function updateStartButton() {
        const isConnected = tonConnectUI && tonConnectUI.connected;
        startBtn.style.opacity = isConnected ? "1" : "0.5";
    }

    // ====================== INIT ======================
    document.addEventListener('DOMContentLoaded', () => {
        setTimeout(initTonConnect, 800);
        updateStartButton();

        // ====================== START GAME WITH LOADING ======================
        startBtn.addEventListener("click", async () => {
            if (!tonConnectUI || !tonConnectUI.connected) {
                alert("⚠️ Please connect your TON wallet first!");
                return;
            }

            // Tampilkan loading screen
            const loadingScreen = document.getElementById('loading-screen');
            loadingScreen.style.display = 'flex';

            // Reset progress
            document.getElementById('loading-bar').style.width = '0%';
            document.getElementById('loading-text').textContent = 'Preparing game...';

            // Simulasi loading (karena gambar sudah di-preload, kita kasih delay kecil biar terlihat)
            let progress = 0;
            const progressInterval = setInterval(() => {
                progress += Math.random() * 25;
                if (progress > 100) progress = 100;
                document.getElementById('loading-bar').style.width = progress + '%';
            }, 120);

            // Tunggu sebentar lalu mulai game
            setTimeout(() => {
                clearInterval(progressInterval);
                document.getElementById('loading-bar').style.width = '100%';
                document.getElementById('loading-text').textContent = 'Starting game...';

                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                    startGame();        // ← Mulai game sesungguhnya
                }, 400);
            }, 1200);
        });


    });
</script>
</body>
</html>
