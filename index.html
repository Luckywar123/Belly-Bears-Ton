<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Belly Bears</title>

    <script src="supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script> -->

    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: url('assets/background-dashboard.png') no-repeat center center fixed;
            background-size: cover;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            z-index: -1;
        }
        #loading-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.6s ease;
        }
        #ui-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
        }
        h1 {
            color: #f39c12;
            text-align: center;
            margin: 40px 0 10px 0;
            font-size: 2.8rem;
        }
        p {
            text-align: center;
            color: #ddd;
            margin-bottom: 20px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <!-- LOADING SCREEN -->
    <div id="loading-screen">
        <img src="assets/ICON.png" alt="Belly Bears" style="width:130px;height:130px;margin-bottom:25px;">
        <h2 style="color:#f39c12;margin:0 0 20px 0;font-size:1.8rem;">Loading Assets...</h2>
        <div style="width:220px;height:10px;background:#333;border-radius:9999px;overflow:hidden;">
            <div id="loading-bar" style="width:0%;height:100%;background:linear-gradient(to right,#f39c12,#f1c40f);transition:width 0.4s;"></div>
        </div>
        <p id="loading-text" style="color:#aaa;margin-top:12px;font-size:1rem;">Preparing game...</p>
    </div>

    <!-- MENU UTAMA -->
    <div id="ui-layer">
        <h1>BELLY BEARS</h1>
        <p>Catch the coins, don't let them escape!</p>
        
        <!--<div id="ton-connect-button" style="margin:20px auto;text-align:center;"></div>-->
        
        <!-- Start Eating Button -->
        <button onclick="startGame()" 
                style="background:none;border:none;padding:0;margin:15px auto 20px;display:block;cursor:pointer;">
            <img src="assets/start-eating.png" alt="Start Eating" style="width:85%;max-width:290px;height:auto;">
        </button>
        
        <!-- Dashboard Button -->
        <button onclick="window.location.href='dashboard.html'" 
                style="background:none;border:none;padding:0;margin:10px auto;display:block;cursor:pointer;">
            <img src="assets/Dashboard.png" alt="Dashboard" style="width:85%;max-width:270px;height:auto;border-radius:12px;">
        </button>
    </div>

    <!-- FOOTER -->
    <footer style="position:fixed;bottom:10px;width:100%;text-align:center;color:#888;font-size:0.9rem;z-index:50;">
        © 2024 Belly Bears. All rights reserved.<br>
        <span style="font-size:10px;">
            Music: "Carefree" & "Sneaky Snitch" by Kevin MacLeod (CC BY 4.0)
        </span>
    </footer>

        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.setHeaderColor("#1a1a1a");

        // INIT
        document.addEventListener('DOMContentLoaded', () => {
            initTonConnect();
            
            // Tampilkan loading dulu
            const loadingScreen = document.getElementById('loading-screen');
            loadingScreen.style.display = "flex";

            // Sembunyikan loading setelah 1.2 detik (bisa diubah)
            setTimeout(() => {
                loadingScreen.style.opacity = "0";
                setTimeout(() => {
                    loadingScreen.style.display = "none";
                }, 600);
            }, 1200);
        });
    </script>
</body>
</html>
