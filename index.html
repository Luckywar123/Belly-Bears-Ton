<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Belly Bears</title>

    <link rel="stylesheet" href="game.css">
    
    <script src="supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: url('assets/background-dashboard.png') no-repeat center center fixed;
            background-size: cover;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.70);
            z-index: -1;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 5;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        #ui-layer > * {
            pointer-events: auto;
        }

        #gameCanvas {
            opacity: 0;
            transition: opacity 0.4s;
        }

        #ingame-ui { 
            display: none; 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 15; pointer-events: none; 
        }
        .stat { 
            position: absolute; color: white; font-weight: bold; 
            font-size: 24px; text-shadow: 0 0 10px rgba(0,0,0,0.9); z-index: 20; 
        }
        #scoreDisplay { top: 20px; left: 25px; }
        #levelDisplay { top: 20px; right: 25px; color: #f1c40f; }
        #comboDisplay { top: 65px; left: 25px; font-size: 20px; color: #ffeb3b; display: none; }
    </style>
</head>

<body>

    <!-- LOADING SCREEN -->
    <div id="loading-screen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a1a; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100;">
        <img src="assets/ICON.png" alt="Belly Bears" style="width: 130px; height: 130px; margin-bottom: 25px;">
        <h2 style="color: #f39c12; margin: 0 0 20px 0; font-size: 1.8rem;">Loading Assets...</h2>
        <div style="width: 220px; height: 10px; background: #333; border-radius: 9999px; overflow: hidden;">
            <div id="loading-bar" style="width: 0%; height: 100%; background: linear-gradient(to right, #f39c12, #f1c40f); transition: width 0.4s;"></div>
        </div>
        <p id="loading-text" style="color: #aaa; margin-top: 12px; font-size: 1rem;">Preparing game...</p>
    </div>

    <!-- COUNTDOWN -->
    <div id="countdown-screen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); display: none; justify-content: center; align-items: center; z-index: 200; font-size: 140px; color: #f39c12; font-weight: bold; text-shadow: 0 0 30px #f39c12;">
    </div>

    <canvas id="gameCanvas"></canvas>

    <!-- MENU UTAMA -->
    <div id="ui-layer">
        <h1 id="title" style="color:#f39c12;text-align:center;margin:40px 0 10px 0;font-size:2.8rem;">BELLY BEARS</h1>
        <p id="desc" style="text-align:center;color:#ddd;margin-bottom:20px;font-size:1.1rem;">Catch the coins, don't let them escape!</p>
        
        <div id="ton-connect-button" style="margin:20px auto;text-align:center;"></div>
        
        <button id="startBtn" style="background:none;border:none;padding:0;margin:15px auto 20px;display:block;cursor:pointer;">
            <img src="assets/start-eating.png" alt="Start Eating" style="width:85%;max-width:290px;height:auto;">
        </button>
        
        <button onclick="window.location.href='dashboard.html'" style="background:none;border:none;padding:0;margin:10px auto;display:block;cursor:pointer;">
            <img src="assets/Dashboard.png" alt="Dashboard" style="width:85%;max-width:270px;height:auto;border-radius:12px;">
        </button>

        <!-- FINAL SCORE (baru) -->
        <div id="finalScoreContainer" style="display: none; text-align: center; margin-top: 30px;">
            <p id="finalScoreEl" style="color: #f1c40f; font-size: 1.8rem; margin: 0; font-weight: bold; text-shadow: 0 0 10px rgba(0,0,0,0.9);"></p>
        </div>
    </div>

    <!-- IN-GAME UI -->
    <div id="ingame-ui">
        <div class="stat" id="scoreDisplay">Score: 0</div>
        <div class="stat" id="levelDisplay">Level 1</div>
        <div class="stat" id="comboDisplay">Combo ×1.5</div>
        <button id="pauseBtn" style="position:absolute;top:20px;right:25px;font-size:32px;color:white;background:none;border:none;cursor:pointer;pointer-events:auto;">⏸</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.setHeaderColor("#1a1a1a");

        const sb = supabase.createClient(window.SUPABASE_CONFIG.URL, window.SUPABASE_CONFIG.ANON_KEY);

        let tonConnectUI = null;

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const uiLayer = document.getElementById("ui-layer");
        const ingameUI = document.getElementById("ingame-ui");
        const startBtn = document.getElementById("startBtn");
        const titleEl = document.getElementById("title");
        const scoreDisplay = document.getElementById("scoreDisplay");
        const levelDisplay = document.getElementById("levelDisplay");
        const comboDisplay = document.getElementById("comboDisplay");
        const pauseBtn = document.getElementById("pauseBtn");
        
        // ELEMENTS YANG SEBELUMNYA ERROR
        const countdownScreen = document.getElementById("countdown-screen");
        const finalScoreContainer = document.getElementById("finalScoreContainer");
        const finalScoreEl = document.getElementById("finalScoreEl");

        let isPlaying = false, isPaused = false;
        let score = 0, caughtCoins = 0, level = 1, combo = 0, lastComboTime = 0;
        let speed = 3.5, spawnInterval = 850;
        let spawnTimer;
        let items = [], particles = [], leaves = [];
        let slowMotionUntil = 0;

        // Bear
        const bear = {
            x: 0, y: 0, width: 90, height: 90,
            imgPending: new Image(),
            imgEating: new Image(),
            currentImg: null
        };
        bear.imgPending.src = "assets/Beruang-pending.png";
        bear.imgEating.src = "assets/Beruang-makan.png";
        bear.currentImg = bear.imgPending;

        // Images
        const coinImg = new Image(); coinImg.src = "assets/coin.png";
        const bombImg = new Image(); bombImg.src = "assets/bom.png";
        const backgroundImg = new Image(); backgroundImg.src = "assets/Background-game.png";
        const slowPowerImg = new Image(); slowPowerImg.src = "assets/slow-power.png";

        class Leaf {
            constructor(){ this.reset(); }
            reset(){
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * -canvas.height * 1.5;
                this.size = Math.random() * 16 + 9;
                this.speed = Math.random() * 1.8 + 0.9;
                this.wobble = Math.random() * Math.PI * 2;
                this.wobbleSpeed = Math.random() * 0.08 + 0.04;
                this.opacity = Math.random() * 0.6 + 0.35;
            }
            update(){
                this.y += this.speed;
                this.wobble += this.wobbleSpeed;
                this.x += Math.sin(this.wobble) * 1.6;
                if (this.y > canvas.height + 60) this.reset();
            }
            draw(){
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.translate(this.x, this.y);
                ctx.rotate(Math.sin(this.wobble) * 0.45);
                ctx.fillStyle = "#4ade80";
                ctx.beginPath();
                ctx.ellipse(0, 0, this.size, this.size * 0.58, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y){
                this.x = x; this.y = y;
                this.vx = Math.random()*6-3;
                this.vy = Math.random()*-5-2;
                this.life = 28;
                this.color = `hsl(${Math.random()*40+40},100%,70%)`;
            }
            update(){ 
                this.x += this.vx; 
                this.y += this.vy; 
                this.vy += 0.25; 
                this.life--; 
            }
            draw(){
                // ← INI YANG DIBENERIN
                ctx.save();
                ctx.globalAlpha = this.life / 28;
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, 6, 6);
                ctx.restore();
            }
        }

        function initLeaves(count = 55){
            leaves = [];
            for(let i = 0; i < count; i++) leaves.push(new Leaf());
        }

        function resizeCanvas(){
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            bear.x = canvas.width / 2 - bear.width / 2;
            bear.y = canvas.height - 165;
        }
        window.addEventListener('resize', resizeCanvas);

        // TON CONNECT (SUDAH DIBENERIN)
        async function initTonConnect() {
            if (tonConnectUI) return;
            try {
                tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
                    manifestUrl: 'https://belly-bears-ton-q9b3.vercel.app/tonconnect-manifest.json',
                    buttonRootId: 'ton-connect-button',
                    uiPreferences: { theme: 'DARK', language: 'en' }
                });
                await tonConnectUI.connectionRestored;
                console.log("✅ TON Connected:", tonConnectUI.connected);
            } catch (e) { console.error("TON Connect error:", e); }
        }

        // ====================== START GAME ======================
        startBtn.addEventListener("click", async () => {
            // RESET MENU
            titleEl.innerText = "BELLY BEARS";
            finalScoreContainer.style.display = 'none';

            if (!tonConnectUI || !tonConnectUI.connected) {
                alert("⚠️ Please connect your TON wallet first!");
                return;
            }

            uiLayer.style.opacity = "0";
            setTimeout(() => { uiLayer.style.display = "none"; }, 400);

            document.getElementById("loading-screen").style.display = 'flex';

            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.random() * 40;
                if (progress > 100) progress = 100;
                document.getElementById('loading-bar').style.width = progress + '%';
            }, 70);

            setTimeout(() => {
                clearInterval(interval);
                document.getElementById("loading-screen").style.display = 'none';
                startCountdown();   // ← pakai countdown seperti yang kamu mau
            }, 1300);
        });

        function startCountdown() {
            countdownScreen.style.display = 'flex';
            let count = 3;
            const timer = setInterval(() => {
                countdownScreen.textContent = count;
                countdownScreen.style.transform = 'scale(1.6)';
                setTimeout(() => { countdownScreen.style.transform = 'scale(1)'; }, 180);
                count--;
                if (count < 0) {
                    clearInterval(timer);
                    countdownScreen.style.display = 'none';
                    startActualGame();
                }
            }, 900);
        }

        function startActualGame() {
            // FULL RESET
            score = 0; caughtCoins = 0; level = 1; combo = 0; speed = 3.5; spawnInterval = 850;
            items = []; particles = []; slowMotionUntil = 0;

            resizeCanvas();
            initLeaves(55);
            ingameUI.style.display = 'block';
            canvas.style.opacity = "1";
            bear.currentImg = bear.imgPending;

            isPlaying = true;
            isPaused = false;

            if (spawnTimer) clearInterval(spawnTimer);
            spawnTimer = setInterval(spawnItem, spawnInterval);

            update();           // mulai game loop
            addGameControls();
        }

        function addGameControls() {
            canvas.addEventListener("touchmove", (e) => {
                if (!isPlaying || isPaused) return;
                bear.x = e.touches[0].clientX - (bear.width / 2);
                bear.x = Math.max(0, Math.min(canvas.width - bear.width, bear.x));
                e.preventDefault();
            }, { passive: false });

            canvas.addEventListener("mousemove", (e) => {
                if (!isPlaying || isPaused) return;
                bear.x = e.clientX - (bear.width / 2);
                bear.x = Math.max(0, Math.min(canvas.width - bear.width, bear.x));
            });
        }

        // ==================== DIFFICULTY (HANYA UPDATE SAAT LEVEL NAIK) ====================
        function updateDifficulty() {
            const newLevel = Math.floor(score / 200) + 1;
            levelDisplay.textContent = `Level ${newLevel}`;

            if (newLevel !== level) {
                level = newLevel;
                speed = Math.min(3.5 + (level - 1) * 0.6, 9.5);
                spawnInterval = Math.max(850 - (level - 1) * 60, 380);

                if (spawnTimer) clearInterval(spawnTimer);
                spawnTimer = setInterval(spawnItem, spawnInterval);
            }
        }

        function spawnItem() {
            if (!isPlaying || isPaused) return;

            const rand = Math.random();
            let type = 'coin';
            if (rand < 0.26) type = 'bomb';
            else if (rand < 0.32) type = 'slow';

            items.push({
                x: Math.random() * (canvas.width - 60),
                y: -70,
                size: 50,
                type: type
            });
        }

        function createParticles(x, y, count = 12) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x + 20, y + 20));
            }
        }

        // ==================== GAME LOOP (RAF SELALU JALAN) ====================
        function update() {
            if (!isPlaying) return;

            if (!isPaused) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Background
                if (backgroundImg.complete) {
                    const scale = Math.max(canvas.width / backgroundImg.width, canvas.height / backgroundImg.height * 0.95);
                    ctx.drawImage(backgroundImg,
                        (canvas.width - backgroundImg.width * scale) / 2,
                        (canvas.height - backgroundImg.height * scale) / 2,
                        backgroundImg.width * scale,
                        backgroundImg.height * scale);
                } else {
                    ctx.fillStyle = "#0f2a1f";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }

                // Leaves
                leaves.forEach(leaf => { leaf.update(); leaf.draw(); });

                // Items (KOIN + BOM + SLOW)
                const now = Date.now();
                const isSlow = now < slowMotionUntil;
                const currentSpeed = isSlow ? speed * 0.45 : speed;

                for (let i = items.length - 1; i >= 0; i--) {
                    const item = items[i];
                    item.y += currentSpeed;

                    // DRAW
                    if (item.type === 'bomb') {
                        ctx.drawImage(bombImg, item.x - 10, item.y - 10, item.size + 20, item.size + 20);
                    } else if (item.type === 'slow') {
                        ctx.drawImage(slowPowerImg, item.x, item.y, item.size, item.size);
                    } else {
                        ctx.drawImage(coinImg, item.x, item.y, item.size, item.size);
                    }

                    // COLLISION
                    if (item.y + 45 > bear.y && item.x + 40 > bear.x && item.x < bear.x + bear.width) {
                        if (item.type === 'bomb') {
                            score = Math.max(0, score - 45);
                            combo = 0;
                        } else if (item.type === 'slow') {
                            slowMotionUntil = now + 4200;
                        } else {
                            const multiplier = (now - lastComboTime < 1200 && combo >= 2) ? 1.5 : 1;
                            score += Math.floor(15 * multiplier);
                            caughtCoins++;
                            combo++;
                            lastComboTime = now;

                            bear.currentImg = bear.imgEating;
                            setTimeout(() => { if (isPlaying) bear.currentImg = bear.imgPending; }, 220);
                            createParticles(item.x + 20, item.y + 10);
                        }
                        items.splice(i, 1);
                        continue;
                    }

                    // Miss coin = game over
                    if (item.y > canvas.height + 80) {
                        if (item.type === 'coin') {
                            gameOver();
                            return;
                        }
                        items.splice(i, 1);
                    }
                }

                // Particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    particles[i].update();
                    particles[i].draw();
                    if (particles[i].life <= 0) particles.splice(i, 1);
                }

                // Bear
                ctx.drawImage(bear.currentImg, bear.x, bear.y, bear.width, bear.height);

                // UI
                scoreDisplay.textContent = `Score: ${score}`;
                updateDifficulty();

                if (combo >= 3) {
                    comboDisplay.style.display = 'block';
                    comboDisplay.textContent = `Combo ×1.5`;
                } else {
                    comboDisplay.style.display = 'none';
                }
            }

            // RAF SELALU JALAN (fix pause & game over)
            requestAnimationFrame(update);
        }

        function gameOver() {
            isPlaying = false;
            if (spawnTimer) clearInterval(spawnTimer);

            canvas.style.opacity = "0";
            setTimeout(() => {
                ingameUI.style.display = 'none';
                uiLayer.style.display = "block";
                uiLayer.style.opacity = "1";
                titleEl.innerText = "GAME OVER!";
                finalScoreContainer.style.display = 'block';
                finalScoreEl.innerText = `Final Score: ${score}`;

                saveScore(score, caughtCoins);
            }, 300);
        }

        // Pause
        pauseBtn.addEventListener('click', () => {
            isPaused = !isPaused;
            pauseBtn.textContent = isPaused ? '▶' : '⏸';
        });

        async function saveScore(finalScore, coinsCaught) {
            if (!tonConnectUI || !tonConnectUI.connected) return;
            const address = tonConnectUI.account.address;
            const tgUser = tg.initDataUnsafe?.user;
            const username = tgUser?.username || tgUser?.first_name || 'Anonymous Bear';

            try {
                const { data: current } = await sb
                    .from('highscores')
                    .select('best_score, total_coins, games_played')
                    .eq('wallet_address', address)
                    .maybeSingle();

                const newBest = Math.max(current?.best_score || 0, finalScore);
                const newTotalCoins = (current?.total_coins || 0) + coinsCaught;
                const newGames = (current?.games_played || 0) + 1;

                await sb.from('highscores').upsert({
                    wallet_address: address,
                    username: username,
                    best_score: newBest,
                    total_coins: newTotalCoins,
                    games_played: newGames,
                    updated_at: new Date().toISOString()
                }, { onConflict: 'wallet_address' });
            } catch (err) {
                console.error("Save score error:", err);
            }
        }

        // INIT
        document.addEventListener('DOMContentLoaded', () => {
            resizeCanvas();
            initTonConnect();
        });
    </script>
</body>
</html>
