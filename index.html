<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Belly Bears</title>

    <link rel="stylesheet" href="game.css">
    
    <script src="supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>


    <style>
        /* BACKGROUND DASHBOARD */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: url('assets/background-dashboard.png') no-repeat center center fixed;
            background-size: cover;
            position: relative;
        }

        /* Overlay gelap agar teks tetap jelas */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65); /* sesuaikan opacity kalau terlalu gelap/terang */
            z-index: -1;
        }

        /* Pastikan semua konten di atas background */
        .card, button, footer {
            position: relative;
            z-index: 2;
        }

        /* Optional: sedikit transparansi pada card biar background kelihatan */
        .card {
            background: rgba(30, 40, 55, 0.92) !important; /* lebih transparan sedikit */
            backdrop-filter: blur(8px);
        }
    </style>
    
</head>

<body>

    <!-- LOADING SCREEN -->
    <div id="loading-screen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a1a; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100;">
        <img src="assets/ICON.png" alt="Belly Bears" style="width: 130px; height: 130px; margin-bottom: 25px;">
        <h2 style="color: #f39c12; margin: 0 0 20px 0; font-size: 1.8rem;">Loading Assets...</h2>
        <div style="width: 220px; height: 10px; background: #333; border-radius: 9999px; overflow: hidden;">
            <div id="loading-bar" style="width: 0%; height: 100%; background: linear-gradient(to right, #f39c12, #f1c40f); transition: width 0.4s;"></div>
        </div>
        <p id="loading-text" style="color: #aaa; margin-top: 12px; font-size: 1rem;">Preparing game...</p>
    </div>

    <!-- COUNTDOWN 3-2-1 -->
    <div id="countdown-screen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); display: none; justify-content: center; align-items: center; z-index: 200; font-size: 140px; color: #f39c12; font-weight: bold; text-shadow: 0 0 30px #f39c12;">
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <h1 id="title" style="color:#f39c12; text-align:center; margin: 20px 0 10px 0;">BELLY BEARS</h1>
        <p id="desc" style="text-align:center; color:#ddd; margin-bottom: 30px;">Catch the coins, don't let them escape!</p>
        <h2 id="finalScore" class="hidden" style="text-align:center; color:#f39c12; font-size: 2.1rem; margin: 20px 0;">Final Score: 0</h2>
        
        <div id="ton-connect-button" style="margin: 15px auto; text-align:center;"></div>
        
        <!-- Tombol Start Eating -->
        <button id="startBtn" style="background: none; border: none; padding: 0; margin: 15px auto 20px; display: block; cursor: pointer;">
            <img src="assets/start-eating.png" alt="Start Eating" style="width: 85%; max-width: 290px; height: auto;">
        </button>
        
        <!-- Tombol Dashboard -->
        <button onclick="window.location.href='dashboard.html'" 
                style="background: none; border: none; padding: 0; margin: 10px auto; display: block; cursor: pointer;">
            <img src="assets/Dashboard.png" alt="Dashboard" style="width: 85%; max-width: 270px; height: auto; border-radius: 12px;">
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.setHeaderColor("#1a1a1a");

        const sb = supabase.createClient(window.SUPABASE_CONFIG.URL, window.SUPABASE_CONFIG.ANON_KEY);

        let tonConnectUI = null;

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const uiLayer = document.getElementById("ui-layer");
        const startBtn = document.getElementById("startBtn");
        const finalScoreEl = document.getElementById("finalScore");
        const titleEl = document.getElementById("title");
        const loadingScreen = document.getElementById("loading-screen");
        const countdownScreen = document.getElementById("countdown-screen");

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let isPlaying = false;
        let score = 0;
        let caughtCoins = 0;
        let items = [];
        let speed = 3.5;
        let spawnTimer;

        // Bear
        const bear = {
            x: canvas.width / 2 - 45,
            y: canvas.height - 150,
            width: 90,
            height: 90,
            imgPending: new Image(),
            imgEating: new Image(),
            currentImg: null
        };

        bear.imgPending.src = "assets/Beruang-pending.png";
        bear.imgEating.src = "assets/Beruang-makan.png";
        bear.currentImg = bear.imgPending;

        // Items
        const coinImg = new Image(); coinImg.src = "assets/coin.png";
        const bombImg = new Image(); bombImg.src = "assets/bom.png";

        // Background
        const backgroundImg = new Image();
        backgroundImg.src = "assets/Background-game.png";

        // Falling Leaves
        let leaves = [];

        class Leaf {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * -canvas.height;
                this.size = Math.random() * 14 + 8;
                this.speed = Math.random() * 1.5 + 0.8;
                this.wobble = Math.random() * Math.PI * 2;
                this.wobbleSpeed = Math.random() * 0.06 + 0.03;
                this.opacity = Math.random() * 0.7 + 0.4;
            }
            update() {
                this.y += this.speed;
                this.wobble += this.wobbleSpeed;
                this.x += Math.sin(this.wobble) * 1.4;
                if (this.y > canvas.height + 50) this.reset();
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.translate(this.x, this.y);
                ctx.rotate(Math.sin(this.wobble) * 0.4);
                ctx.fillStyle = "#4ade80";
                ctx.beginPath();
                ctx.ellipse(0, 0, this.size, this.size * 0.55, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function initLeaves(count = 45) {
            leaves = [];
            for (let i = 0; i < count; i++) leaves.push(new Leaf());
        }

        // ====================== TON CONNECT ======================
        async function initTonConnect() {
            if (tonConnectUI) return;
            try {
                tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
                    manifestUrl: 'https://belly-bears-ton-q9b3.vercel.app/tonconnect-manifest.json',
                    buttonRootId: 'ton-connect-button',
                    uiPreferences: { theme: 'DARK', language: 'en' }
                });
                await tonConnectUI.connectionRestored;
            } catch (e) {
                console.error("TON Connect failed:", e);
            }
        }

        // ====================== START GAME ======================
        startBtn.addEventListener("click", async () => {
            if (!tonConnectUI || !tonConnectUI.connected) {
                alert("⚠️ Please connect your TON wallet first!");
                return;
            }

            loadingScreen.style.display = 'flex';

            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.random() * 40;
                if (progress > 100) progress = 100;
                document.getElementById('loading-bar').style.width = progress + '%';
            }, 80);

            setTimeout(() => {
                clearInterval(interval);
                loadingScreen.style.display = 'none';
                startCountdown();
            }, 1500);
        });

        function startCountdown() {
            countdownScreen.style.display = 'flex';
            let count = 3;

            const timer = setInterval(() => {
                countdownScreen.textContent = count;
                countdownScreen.style.transform = 'scale(1.6)';
                setTimeout(() => { countdownScreen.style.transform = 'scale(1)'; }, 180);

                count--;
                if (count < 0) {
                    clearInterval(timer);
                    countdownScreen.style.display = 'none';
                    startActualGame();
                }
            }, 900);
        }

        function startActualGame() {
            isPlaying = true;
            score = 0;
            caughtCoins = 0;
            items = [];
            initLeaves(45);
            uiLayer.classList.add("hidden");
            bear.currentImg = bear.imgPending;

            if (spawnTimer) clearInterval(spawnTimer);
            spawnTimer = setInterval(spawnItem, 850);
            update();
            addGameControls();
        }

        function addGameControls() {
            canvas.addEventListener("touchmove", (e) => {
                if (!isPlaying) return;
                bear.x = e.touches[0].clientX - (bear.width / 2);
                bear.x = Math.max(0, Math.min(canvas.width - bear.width, bear.x));
                e.preventDefault();
            }, { passive: false });

            canvas.addEventListener("mousemove", (e) => {
                if (!isPlaying) return;
                bear.x = e.clientX - (bear.width / 2);
                bear.x = Math.max(0, Math.min(canvas.width - bear.width, bear.x));
            });
        }

        function spawnItem() {
            if (!isPlaying) return;
            const isBomb = Math.random() < 0.28;
            items.push({
                x: Math.random() * (canvas.width - 60),
                y: -60,
                size: 48,
                isBomb: isBomb
            });
        }

        function update() {
            if (!isPlaying) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Background
            if (backgroundImg.complete) {
                const scale = Math.max(canvas.width / backgroundImg.width, canvas.height / backgroundImg.height * 0.92);
                const newW = backgroundImg.width * scale;
                const newH = backgroundImg.height * scale;
                const offsetX = (canvas.width - newW) / 2;
                const offsetY = (canvas.height - newH) / 2;
                ctx.drawImage(backgroundImg, offsetX, offsetY, newW, newH);
            } else {
                ctx.fillStyle = "#1a2f1f";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // Falling Leaves
            for (let i = 0; i < leaves.length; i++) {
                leaves[i].update();
                leaves[i].draw();
            }

            // Bear
            ctx.drawImage(bear.currentImg, bear.x, bear.y, bear.width, bear.height);

            // Items
            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                item.y += speed;

                if (item.isBomb) {
                    ctx.drawImage(bombImg, item.x - 8, item.y - 8, item.size + 16, item.size + 16);
                } else {
                    ctx.drawImage(coinImg, item.x, item.y, item.size, item.size);
                }

                if (item.y + 40 > bear.y && item.x + 40 > bear.x && item.x < bear.x + bear.width) {
                    if (item.isBomb) {
                        score = Math.max(0, score - 40);
                    } else {
                        score += 15;
                        caughtCoins += 1;
                        bear.currentImg = bear.imgEating;
                        setTimeout(() => { if (isPlaying) bear.currentImg = bear.imgPending; }, 280);
                    }
                    items.splice(i, 1);
                    continue;
                }

                if (item.y > canvas.height + 50) {
                    if (!item.isBomb) {
                        gameOver();
                        return;
                    }
                    items.splice(i, 1);
                }
            }

            ctx.fillStyle = "white";
            ctx.font = "bold 28px Arial";
            ctx.fillText("Score: " + score, 30, 65);

            requestAnimationFrame(update);
        }

        function gameOver() {
            isPlaying = false;
            clearInterval(spawnTimer);
            uiLayer.classList.remove("hidden");
            titleEl.innerText = "GAME OVER!";
            finalScoreEl.innerText = "Final Score: " + score;
            finalScoreEl.classList.remove("hidden");

            saveScore(score, caughtCoins);
        }

        async function saveScore(finalScore, coinsCaught) {
            if (!tonConnectUI || !tonConnectUI.connected) return;

            const address = tonConnectUI.account.address;
            const tgUser = tg.initDataUnsafe?.user;
            const username = tgUser?.username || tgUser?.first_name || 'Anonymous Bear';

            try {
                const { data: current } = await sb
                    .from('highscores')
                    .select('best_score, total_coins, games_played')
                    .eq('wallet_address', address)
                    .maybeSingle();

                const newBest = Math.max(current?.best_score || 0, finalScore);
                const newTotalCoins = (current?.total_coins || 0) + coinsCaught;
                const newGames = (current?.games_played || 0) + 1;

                const { error } = await sb.from('highscores').upsert({
                    wallet_address: address,
                    username: username,
                    best_score: newBest,
                    total_coins: newTotalCoins,
                    games_played: newGames,
                    updated_at: new Date().toISOString()
                }, { onConflict: 'wallet_address' });

                if (error) console.error("Upsert error:", error);
                else console.log("✅ Score berhasil disimpan ke database!");

            } catch (err) {
                console.error("Error saving score:", err);
            }
        }

        function addGameControls() {
            canvas.addEventListener("touchmove", (e) => {
                if (!isPlaying) return;
                bear.x = e.touches[0].clientX - (bear.width / 2);
                bear.x = Math.max(0, Math.min(canvas.width - bear.width, bear.x));
                e.preventDefault();
            }, { passive: false });

            canvas.addEventListener("mousemove", (e) => {
                if (!isPlaying) return;
                bear.x = e.clientX - (bear.width / 2);
                bear.x = Math.max(0, Math.min(canvas.width - bear.width, bear.x));
            });
        }

        function spawnItem() {
            if (!isPlaying) return;
            const isBomb = Math.random() < 0.28;
            items.push({
                x: Math.random() * (canvas.width - 60),
                y: -60,
                size: 48,
                isBomb: isBomb
            });
        }

        // INIT
        document.addEventListener('DOMContentLoaded', () => {
            initTonConnect();
        });
    </script>
</body>
</html>
