<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Belly Bears</title>

    <link rel="stylesheet" href="game.css">
    
    <script src="supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
</head>

<body>

    <!-- LOADING SCREEN -->
    <div id="loading-screen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a1a; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100;">
        <img src="assets/ICON.png" alt="Belly Bears" style="width: 120px; height: 120px; margin-bottom: 20px;">
        <h2 style="color: #f39c12; margin: 0 0 15px 0;">Loading Assets...</h2>
        <div style="width: 200px; height: 8px; background: #333; border-radius: 10px; overflow: hidden;">
            <div id="loading-bar" style="width: 0%; height: 100%; background: #f39c12; transition: width 0.3s;"></div>
        </div>
        <p id="loading-text" style="color: #aaa; margin-top: 10px; font-size: 0.95rem;">Preparing game...</p>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <h1 id="title" style="color:#f39c12;">BELLY BEARS</h1>
        <p id="desc">Catch the coins, don't let them escape!</p>
        <h2 id="finalScore" class="hidden">Final Score: 0</h2>
        
        <div id="ton-connect-button"></div>
        
        <!-- Tombol Start Eating -->
        <button id="startBtn" style="background: none; border: none; padding: 0; margin: 15px auto 10px; display: block; cursor: pointer;">
            <img src="assets/start-eating.png" alt="Start Eating" style="width: 85%; max-width: 280px; height: auto;">
        </button>
        
        <!-- Tombol Dashboard -->
        <button onclick="window.location.href='dashboard.html'" 
                style="background: none; border: none; padding: 0; margin: 20px auto 10px; display: block; cursor: pointer;">
            <img src="assets/Dashboard.png" alt="Dashboard" style="width: 85%; max-width: 260px; height: auto; border-radius: 12px;">
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.setHeaderColor("#1a1a1a");

        const sb = supabase.createClient(window.SUPABASE_CONFIG.URL, window.SUPABASE_CONFIG.ANON_KEY);

        let tonConnectUI = null;

        // ==================== GAME SETUP ====================
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const uiLayer = document.getElementById("ui-layer");
        const startBtn = document.getElementById("startBtn");
        const finalScoreEl = document.getElementById("finalScore");
        const titleEl = document.getElementById("title");

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let isPlaying = false;
        let score = 0;
        let caughtCoins = 0;
        let items = [];
        let speed = 3.5;
        let spawnTimer;

        // Bear
        const bear = {
            x: canvas.width / 2 - 45,
            y: canvas.height - 150,
            width: 90,
            height: 90,
            imgPending: new Image(),
            imgEating: new Image(),
            currentImg: null
        };

        bear.imgPending.src = "assets/Beruang-pending.png";
        bear.imgEating.src = "assets/Beruang-makan.png";
        bear.currentImg = bear.imgPending;

        // Items
        const coinImg = new Image(); coinImg.src = "assets/coin.png";
        const bombImg = new Image(); bombImg.src = "assets/bom.png";
        
        // Background
        const backgroundImg = new Image();
        backgroundImg.src = "assets/background-game.png";  
        backgroundImg.onload = () => console.log("Background loaded successfully");
        
        
        // Variabel untuk posisi background (kalau mau gerak pelan)
        let bgOffsetY = 0;



        // Falling Leaves Particles
        let leaves = [];

        class Leaf {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * -canvas.height;  // mulai dari atas
                this.size = Math.random() * 12 + 8;       // ukuran daun
                this.speed = Math.random() * 1.2 + 0.8;   // kecepatan jatuh
                this.wobble = Math.random() * Math.PI * 2; // goyang kiri-kanan
                this.wobbleSpeed = Math.random() * 0.05 + 0.02;
                this.opacity = Math.random() * 0.6 + 0.4;
            }
            update() {
                this.y += this.speed;
                this.wobble += this.wobbleSpeed;
                this.x += Math.sin(this.wobble) * 1.2;   // efek goyang

                // Reset kalau sudah keluar layar bawah
                if (this.y > canvas.height + 50) {
                    this.reset();
                }
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.translate(this.x, this.y);
                ctx.rotate(Math.sin(this.wobble) * 0.3);  // rotasi daun

                // Gambar daun sederhana (bisa diganti dengan image kalau mau lebih bagus)
                ctx.fillStyle = "#4ade80";   // hijau daun
                ctx.beginPath();
                ctx.ellipse(0, 0, this.size, this.size * 0.6, 0, 0, Math.PI * 2);
                ctx.fill();

                // Vein sederhana
                ctx.strokeStyle = "#22c55e";
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(0, -this.size * 0.5);
                ctx.lineTo(0, this.size * 0.5);
                ctx.stroke();

                ctx.restore();
            }
        }

        // Inisialisasi daun (30-50 biji cukup)
        function initLeaves(count = 40) {
            leaves = [];
            for (let i = 0; i < count; i++) {
                leaves.push(new Leaf());
            }
        }





        // ====================== TON CONNECT ======================
        async function initTonConnect() {
            if (tonConnectUI) return;
            try {
                tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
                    manifestUrl: 'https://belly-bears-ton-q9b3.vercel.app/tonconnect-manifest.json',
                    buttonRootId: 'ton-connect-button',
                    uiPreferences: { theme: 'DARK', language: 'en' }
                });
                await tonConnectUI.connectionRestored;
            } catch (e) {
                console.error("TON Connect failed:", e);
            }
        }

        // ====================== START GAME WITH LOADING ======================
        startBtn.addEventListener("click", async () => {
            if (!tonConnectUI || !tonConnectUI.connected) {
                alert("⚠️ Please connect your TON wallet first!");
                return;
            }

            const loadingScreen = document.getElementById('loading-screen');
            loadingScreen.style.display = 'flex';

            let progress = 0;
            const progressInterval = setInterval(() => {
                progress += Math.random() * 35;
                if (progress > 100) progress = 100;
                document.getElementById('loading-bar').style.width = progress + '%';
            }, 70);

            setTimeout(() => {
                clearInterval(progressInterval);
                document.getElementById('loading-bar').style.width = '100%';
                document.getElementById('loading-text').textContent = 'Starting game...';

                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                    startActualGame();
                }, 400);
            }, 1300);
        });

        function startActualGame() {
            isPlaying = true;
            score = 0;
            caughtCoins = 0;
            speed = 3.5;
            items = [];
            initLeaves(45);   // jumlah daun
            uiLayer.classList.add("hidden");
            bear.currentImg = bear.imgPending;

            if (spawnTimer) clearInterval(spawnTimer);
            spawnTimer = setInterval(spawnItem, 850);
            update();

            // Pastikan event listener aktif saat game mulai
            addGameControls();
        }

        function addGameControls() {
            // Remove old listeners to avoid duplicates
            canvas.removeEventListener("touchmove", handleTouchMove);
            canvas.removeEventListener("mousemove", handleMouseMove);

            canvas.addEventListener("touchmove", handleTouchMove, { passive: false });
            canvas.addEventListener("mousemove", handleMouseMove);
        }

        function handleTouchMove(e) {
            if (!isPlaying) return;
            bear.x = e.touches[0].clientX - (bear.width / 2);
            bear.x = Math.max(0, Math.min(canvas.width - bear.width, bear.x));
            e.preventDefault();
        }

        function handleMouseMove(e) {
            if (!isPlaying) return;
            bear.x = e.clientX - (bear.width / 2);
            bear.x = Math.max(0, Math.min(canvas.width - bear.width, bear.x));
        }

        function spawnItem() {
            if (!isPlaying) return;
            const isBomb = Math.random() < 0.28;

            items.push({
                x: Math.random() * (canvas.width - 60),
                y: -60,
                size: 48,
                isBomb: isBomb
            });
        }

        function update() {
            if (!isPlaying) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // ==================== BACKGROUND AUTO SCALE ====================
            if (backgroundImg.complete) {
                const imgW = backgroundImg.width;
                const imgH = backgroundImg.height;
                const canvasW = canvas.width;
                const canvasH = canvas.height;

                const scale = Math.max(canvasW / imgW, canvasH / imgH);   // Cover style

                const newW = imgW * scale;
                const newH = imgH * scale;

                const offsetX = (canvasW - newW) / 2;
                const offsetY = (canvasH - newH) / 2;

                ctx.drawImage(backgroundImg, 
                    offsetX, offsetY + bgOffsetY, 
                    newW, newH);
            } else {
                // Fallback warna hutan
                ctx.fillStyle = "#1a2f1f";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // ==================== FALLING LEAVES ====================
            for (let i = 0; i < leaves.length; i++) {
                leaves[i].update();
                leaves[i].draw();
            }

            // ==================== BEAR ====================
            ctx.drawImage(bear.currentImg, bear.x, bear.y, bear.width, bear.height);

            // ==================== ITEMS (COIN & BOMB) ====================
            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                item.y += speed;

                if (item.isBomb) {
                    ctx.drawImage(bombImg, item.x - 8, item.y - 8, item.size + 16, item.size + 16);
                } else {
                    ctx.drawImage(coinImg, item.x, item.y, item.size, item.size);
                }

                // Collision dengan bear
                if (item.y + 40 > bear.y && item.x + 40 > bear.x && item.x < bear.x + bear.width) {
                    if (item.isBomb) {
                        score = Math.max(0, score - 40);
                    } else {
                        score += 15;
                        caughtCoins += 1;
                        bear.currentImg = bear.imgEating;
                        setTimeout(() => { 
                            if (isPlaying) bear.currentImg = bear.imgPending; 
                        }, 280);
                    }
                    items.splice(i, 1);
                    continue;
                }

                // Item keluar layar bawah
                if (item.y > canvas.height + 50) {
                    if (!item.isBomb) {
                        gameOver();
                        return;
                    }
                    items.splice(i, 1);
                }
            }

            // ==================== SCORE TEXT ====================
            ctx.fillStyle = "white";
            ctx.font = "bold 28px Arial";
            ctx.fillText("Score: " + score, 30, 65);

            requestAnimationFrame(update);
        }

        function gameOver() {
            isPlaying = false;
            clearInterval(spawnTimer);
            uiLayer.classList.remove("hidden");
            titleEl.innerText = "GAME OVER!";
            finalScoreEl.innerText = "Final Score: " + score;
            finalScoreEl.classList.remove("hidden");

            saveScore(score, caughtCoins);
        }

        async function saveScore(finalScore, coinsCaught) {
            if (!tonConnectUI || !tonConnectUI.connected) return;
            const address = tonConnectUI.account.address;
            const tgUser = tg.initDataUnsafe?.user;
            const username = tgUser?.username || tgUser?.first_name || 'Anonymous Bear';

            try {
                const { data: current } = await sb
                    .from('highscores')
                    .select('best_score, total_coins, games_played')
                    .eq('wallet_address', address)
                    .maybeSingle();

                const newBest = Math.max(current?.best_score || 0, finalScore);
                const newTotalCoins = (current?.total_coins || 0) + coinsCaught;
                const newGames = (current?.games_played || 0) + 1;

                await sb.from('highscores').upsert({
                    wallet_address: address,
                    username: username,
                    best_score: newBest,
                    total_coins: newTotalCoins,
                    games_played: newGames,
                    updated_at: new Date().toISOString()
                }, { onConflict: 'wallet_address' });
            } catch (err) {
                console.error("Error saving score:", err);
            }
        }

        // INIT
        document.addEventListener('DOMContentLoaded', () => {
            initTonConnect();
        });
    </script>
</body>
</html>
